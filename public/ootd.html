<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<script>
  (function(){
    try{
      var mode = localStorage.getItem('theme-mode') || 'light';
      var actual = mode;
      if(mode==='system'){
        actual = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', actual);
    }catch(e){}
  })();
</script>
<title>OOTD 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fafafa; --surface:#ffffff; --border:#ececec; --border-2:#e2e2e2;
    --text:#18181b; --text-muted:#8a8a92;
    --accent:#5b5bd6; --accent-soft:#eeeeff; --accent-dark:#4747b8;
    --danger:#e05252; --sun:#e05252; --sat:#4f7fd6;
    --radius:16px; --safe-b: env(safe-area-inset-bottom, 0px);
  }
  html[data-theme="dark"]{
    color-scheme: dark;
    --bg:#111114; --surface:#1c1c21; --border:#2a2a30; --border-2:#35353d;
    --text:#eeeef0; --text-muted:#9494a0;
    --accent:#8080e8; --accent-soft:#26264a; --accent-dark:#a0a0f0;
    --danger:#f27272; --sun:#f27272; --sat:#7fa6f0;
  }
  html[data-theme="light"]{ color-scheme: light; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Inter',-apple-system,'Malgun Gothic',sans-serif;
    min-height:100vh; min-height:100dvh; padding-bottom:calc(110px + var(--safe-b)); -webkit-font-smoothing:antialiased; touch-action:manipulation; }
  .wrap{ max-width:600px; margin:0 auto; padding:28px 16px 0; }

  .header-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  h1.title{ font-size:23px; margin:0 0 4px; font-weight:800; letter-spacing:-0.02em; }
  .subtitle{ color:var(--text-muted); font-size:13px; margin:0 0 22px; font-weight:500; }
  .back-link{ background:var(--surface); border:1px solid var(--border); color:var(--text-muted); border-radius:10px; padding:8px 11px; font-size:12px; font-weight:700; text-decoration:none; white-space:nowrap; }

  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 12px; box-shadow:0 1px 2px rgba(0,0,0,0.02); }

  .month-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; padding:0 4px; }
  .month-nav .m{ font-size:18px; font-weight:800; letter-spacing:-0.01em; font-variant-numeric:tabular-nums; }
  .nav-btn{ background:var(--bg); border:1.5px solid var(--border-2); color:var(--text); width:36px; height:36px; border-radius:10px; font-size:16px; cursor:pointer; }
  .month-meta{ text-align:center; color:var(--text-muted); font-size:12px; font-weight:600; margin-bottom:14px; }
  .month-meta b{ color:var(--accent-dark); }
  .today-btn{ background:none; border:none; color:var(--accent); font-size:12px; font-weight:700; cursor:pointer; padding:2px 6px; }

  .weekdays, .grid{ display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:4px; }
  .weekdays div{ text-align:center; font-size:11px; font-weight:700; color:var(--text-muted); padding-bottom:6px; }
  .weekdays div:first-child{ color:var(--sun); }
  .weekdays div:last-child{ color:var(--sat); }

  .day{ position:relative; aspect-ratio:3/4; border-radius:9px; background:var(--bg); border:1px solid var(--border); overflow:hidden; cursor:pointer; padding:0; font:inherit; color:inherit; }
  .day.empty{ background:transparent; border-color:transparent; cursor:default; }
  .day img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .day .dn{ position:absolute; top:4px; left:5px; font-size:11px; font-weight:700; z-index:1; font-variant-numeric:tabular-nums; }
  .day.sun .dn{ color:var(--sun); }
  .day.sat .dn{ color:var(--sat); }
  .day.has .dn{ color:#fff; text-shadow:0 1px 3px rgba(0,0,0,0.55); }
  .day.today{ border:2px solid var(--accent); }
  .day .cnt{ position:absolute; right:4px; bottom:4px; z-index:1; background:rgba(0,0,0,0.55); color:#fff; font-size:10px; font-weight:700; border-radius:8px; padding:1px 5px; }

  .fab{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(22px + var(--safe-b)); background:var(--accent); color:#fff; border:none; border-radius:30px; padding:15px 26px; font-size:15px; font-weight:700; cursor:pointer; box-shadow:0 6px 20px rgba(91,91,214,0.35); z-index:20; white-space:nowrap; font-family:inherit; }
  .fab:active{ background:var(--accent-dark); }

  .hint{ margin-top:14px; color:var(--text-muted); font-size:12px; line-height:1.6; text-align:center; }
  .tools{ display:flex; justify-content:center; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .chip-btn{ background:var(--surface); border:1.5px solid var(--border-2); color:var(--text-muted); border-radius:20px; padding:7px 12px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; }

  /* 모달 */
  .modal-bg{ position:fixed; inset:0; background:rgba(0,0,0,0.5); display:none; align-items:flex-end; justify-content:center; z-index:50; }
  .modal-bg.open{ display:flex; }
  .modal{ background:var(--surface); width:100%; max-width:600px; max-height:90vh; max-height:90dvh; overflow-y:auto; border-radius:20px 20px 0 0; padding:20px 16px calc(20px + var(--safe-b)); }
  .modal-h{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .modal-h .t{ font-size:17px; font-weight:800; }
  .close-btn{ background:var(--bg); border:1px solid var(--border); color:var(--text-muted); width:32px; height:32px; border-radius:10px; font-size:16px; cursor:pointer; }

  .entry{ border:1px solid var(--border); border-radius:14px; overflow:hidden; margin-bottom:14px; background:var(--bg); }
  .entry img{ width:100%; display:block; max-height:58vh; object-fit:contain; background:#000; }
  .entry .body{ padding:12px; display:flex; flex-direction:column; gap:10px; }
  .entry .row{ display:flex; gap:8px; align-items:center; }
  .entry label{ font-size:11px; font-weight:700; color:var(--text-muted); flex-shrink:0; width:42px; }
  .entry input[type=date], .entry textarea{ flex:1; min-width:0; border:1.5px solid var(--border-2); border-radius:10px; background:var(--surface); padding:9px 10px; font-size:16px; color:var(--text); font-family:inherit; outline:none; }
  .entry textarea{ resize:vertical; min-height:42px; }
  .entry .src{ font-size:11px; color:var(--text-muted); }
  .entry .acts{ display:flex; gap:8px; justify-content:flex-end; }
  .btn{ border:none; border-radius:10px; padding:9px 14px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; }
  .btn.primary{ background:var(--accent); color:#fff; }
  .btn.ghost{ background:var(--surface); border:1.5px solid var(--border-2); color:var(--text); }
  .btn.danger{ background:none; color:var(--danger); border:1.5px solid var(--border-2); }

  .toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(90px + var(--safe-b)); background:var(--text); color:var(--bg); padding:10px 16px; border-radius:12px; font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .2s; z-index:60; max-width:calc(100% - 32px); text-align:center; }
  .toast.show{ opacity:1; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header-row">
    <div>
      <h1 class="title">OOTD 기록</h1>
      <p class="subtitle">사진을 올리면 찍은 날짜에 맞춰 캘린더에 들어가요</p>
    </div>
    <a class="back-link" href="/">📚 독서기록</a>
  </div>

  <div class="panel">
    <div class="month-nav">
      <button class="nav-btn" id="prevBtn" aria-label="이전 달">‹</button>
      <div class="m" id="monthLabel"></div>
      <button class="nav-btn" id="nextBtn" aria-label="다음 달">›</button>
    </div>
    <div class="month-meta"><span id="monthMeta"></span> <button class="today-btn" id="todayBtn">오늘</button></div>
    <div class="weekdays"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="tools">
    <button class="chip-btn" id="exportBtn">⬇️ 백업 내보내기</button>
    <button class="chip-btn" id="importBtn">⬆️ 백업 불러오기</button>
  </div>
  <p class="hint">사진은 이 기기 브라우저 안에만 저장돼요.<br>촬영 날짜 정보가 없는 사진은 파일 날짜로 들어가고, 날짜를 눌러 바꿀 수 있어요.</p>
</div>

<button class="fab" id="addBtn">＋ 사진 올리기</button>
<input type="file" id="fileInput" accept="image/*" multiple hidden>
<input type="file" id="importInput" accept="application/json,.json" hidden>

<div class="modal-bg" id="modalBg">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-h">
      <div class="t" id="modalTitle"></div>
      <button class="close-btn" id="closeBtn" aria-label="닫기">✕</button>
    </div>
    <div id="modalBody"></div>
    <button class="btn ghost" id="addToDayBtn" style="width:100%">＋ 이 날짜에 사진 추가</button>
  </div>
</div>
<input type="file" id="dayFileInput" accept="image/*" multiple hidden>

<div class="toast" id="toast"></div>

<script>
/* ---------- 저장소 (IndexedDB) ---------- */
const DB_NAME = 'ootd-db', STORE = 'outfits';
let dbPromise = null;
function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = ()=>{
      const s = req.result.createObjectStore(STORE, { keyPath:'id' });
      s.createIndex('date', 'date');
    };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return dbPromise;
}
async function tx(mode, fn){
  const db = await openDB();
  return new Promise((resolve, reject)=>{
    const t = db.transaction(STORE, mode);
    const store = t.objectStore(STORE);
    let result;
    Promise.resolve(fn(store)).then(r=>{ result = r; });
    t.oncomplete = ()=> resolve(result);
    t.onerror = ()=> reject(t.error);
  });
}
function reqP(r){ return new Promise((res, rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
const dbAll = ()=> tx('readonly', s=> reqP(s.getAll()));
const dbPut = (item)=> tx('readwrite', s=>{ s.put(item); });
const dbDel = (id)=> tx('readwrite', s=>{ s.delete(id); });

/* ---------- EXIF 촬영일 읽기 ---------- */
// JPEG/HEIC 어느 형식이든 파일 앞부분에서 "Exif\0\0" 뒤의 TIFF 헤더를 찾아
// DateTimeOriginal(촬영 시각) → DateTimeDigitized → DateTime 순서로 읽음
async function readExifDate(file){
  try{
    const buf = await file.slice(0, 512*1024).arrayBuffer();
    const u8 = new Uint8Array(buf);
    let tiff = -1;
    for(let i=0; i<u8.length-10; i++){
      if(u8[i]===0x45 && u8[i+1]===0x78 && u8[i+2]===0x69 && u8[i+3]===0x66 && u8[i+4]===0 && u8[i+5]===0){
        const a=u8[i+6], b=u8[i+7];
        if((a===0x49 && b===0x49) || (a===0x4D && b===0x4D)){ tiff = i+6; break; }
      }
    }
    if(tiff<0) return null;
    const dv = new DataView(buf);
    const le = u8[tiff]===0x49;
    const u16 = o=> dv.getUint16(tiff+o, le);
    const u32 = o=> dv.getUint32(tiff+o, le);
    const readStr = (off, len)=>{
      let s=''; for(let k=0;k<len;k++){ const c=u8[tiff+off+k]; if(!c) break; s+=String.fromCharCode(c); } return s;
    };
    const readIfd = (off)=>{
      const out = {};
      if(tiff+off+2 > u8.length) return out;
      const n = u16(off);
      for(let k=0;k<n;k++){
        const e = off+2+k*12;
        if(tiff+e+12 > u8.length) break;
        const tag=u16(e), type=u16(e+2), cnt=u32(e+4);
        if(type===2){ out[tag] = readStr(cnt>4 ? u32(e+8) : e+8, cnt); }
        else if(type===4 || type===13){ out[tag] = u32(e+8); }
      }
      return out;
    };
    const ifd0 = readIfd(u32(4));
    let exif = {};
    if(ifd0[0x8769]) exif = readIfd(ifd0[0x8769]);
    const raw = exif[0x9003] || exif[0x9004] || ifd0[0x0132];
    const m = raw && raw.match(/^(\d{4})[:\-](\d{2})[:\-](\d{2})/);
    if(!m || m[1]==='0000') return null;
    return `${m[1]}-${m[2]}-${m[3]}`;
  }catch(e){ return null; }
}

/* ---------- 이미지 축소 ---------- */
function loadImage(blob){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = ()=>{ URL.revokeObjectURL(url); resolve(img); };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('이미지를 열 수 없어요')); };
    img.src = url;
  });
}
function resize(img, max, quality){
  const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth*scale), h = Math.round(img.naturalHeight*scale);
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  c.getContext('2d').drawImage(img, 0, 0, w, h);
  return new Promise(res=> c.toBlob(res, 'image/jpeg', quality));
}

/* ---------- 상태 ---------- */
let items = [];
let view = (()=>{ const d=new Date(); return { y:d.getFullYear(), m:d.getMonth() }; })();
let openDate = null;
const urlCache = new Map();
function urlFor(item, kind){
  const key = item.id + ':' + kind;
  if(!urlCache.has(key)) urlCache.set(key, URL.createObjectURL(item[kind]));
  return urlCache.get(key);
}
function dropUrls(id){
  for(const k of ['thumb','full']){ const key=id+':'+k; if(urlCache.has(key)){ URL.revokeObjectURL(urlCache.get(key)); urlCache.delete(key); } }
}
const pad = n=> String(n).padStart(2,'0');
const ymd = d=> `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function byDate(){
  const map = {};
  for(const it of items){ (map[it.date] ||= []).push(it); }
  for(const k in map) map[k].sort((a,b)=> a.addedAt-b.addedAt);
  return map;
}

/* ---------- 캘린더 그리기 ---------- */
function render(){
  const { y, m } = view;
  document.getElementById('monthLabel').textContent = `${y}년 ${m+1}월`;
  const map = byDate();
  const first = new Date(y, m, 1).getDay();
  const days = new Date(y, m+1, 0).getDate();
  const today = ymd(new Date());
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  let recorded = 0;
  for(let i=0;i<first;i++){ const e=document.createElement('div'); e.className='day empty'; grid.appendChild(e); }
  for(let d=1; d<=days; d++){
    const key = `${y}-${pad(m+1)}-${pad(d)}`;
    const list = map[key] || [];
    const dow = (first + d - 1) % 7;
    const cell = document.createElement('button');
    cell.className = 'day' + (dow===0?' sun':'') + (dow===6?' sat':'') + (key===today?' today':'') + (list.length?' has':'');
    cell.setAttribute('aria-label', `${m+1}월 ${d}일, 사진 ${list.length}장`);
    if(list.length){
      recorded++;
      const img = document.createElement('img');
      img.src = urlFor(list[0], 'thumb'); img.alt = ''; img.loading = 'lazy';
      cell.appendChild(img);
      if(list.length>1){ const c=document.createElement('span'); c.className='cnt'; c.textContent=list.length; cell.appendChild(c); }
    }
    const dn = document.createElement('span'); dn.className='dn'; dn.textContent=d; cell.appendChild(dn);
    cell.onclick = ()=> list.length ? openDay(key) : pickForDay(key);
    grid.appendChild(cell);
  }
  document.getElementById('monthMeta').innerHTML = `이번 달 <b>${recorded}</b>일 기록`;
}

/* ---------- 사진 추가 ---------- */
async function addFiles(files, forcedDate){
  files = [...files].filter(f=> f.type.startsWith('image/') || /\.(heic|heif)$/i.test(f.name));
  if(!files.length) return;
  toast(`사진 ${files.length}장 처리 중…`, 60000);
  let ok=0, noExif=0, failed=0, lastDate=null;
  for(const f of files){
    try{
      const exifDate = await readExifDate(f);
      const date = forcedDate || exifDate || ymd(new Date(f.lastModified || Date.now()));
      if(!forcedDate && !exifDate) noExif++;
      const img = await loadImage(f);
      const [full, thumb] = await Promise.all([ resize(img, 1440, 0.85), resize(img, 360, 0.8) ]);
      await dbPut({ id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()+Math.random()),
        date, full, thumb, memo:'', source: forcedDate ? 'manual' : (exifDate ? 'exif' : 'file'), addedAt: Date.now() });
      ok++; lastDate = date;
    }catch(e){ failed++; }
  }
  items = await dbAll();
  if(lastDate && !forcedDate){ const [yy,mm] = lastDate.split('-').map(Number); view = { y:yy, m:mm-1 }; }
  render();
  if(openDate) openDay(openDate);
  let msg = `${ok}장 추가했어요`;
  if(noExif) msg += ` · ${noExif}장은 촬영일 정보가 없어 파일 날짜로 넣었어요`;
  if(failed) msg += ` · ${failed}장은 열 수 없었어요(HEIC는 JPG로 바꿔서 올려주세요)`;
  toast(msg, 4000);
}

/* ---------- 날짜 상세 (모달) ---------- */
function fmtKo(key){
  const [y,m,d] = key.split('-').map(Number);
  const w = '일월화수목금토'[new Date(y,m-1,d).getDay()];
  return `${y}년 ${m}월 ${d}일 (${w})`;
}
function openDay(key){
  openDate = key;
  const list = byDate()[key] || [];
  if(!list.length){ closeModal(); return; }
  document.getElementById('modalTitle').textContent = fmtKo(key);
  const body = document.getElementById('modalBody');
  body.innerHTML = '';
  for(const it of list){
    const box = document.createElement('div'); box.className='entry';
    const srcText = { exif:'📷 사진 촬영일로 등록됨', file:'📁 촬영일 정보가 없어 파일 날짜로 등록됨', manual:'✏️ 직접 고른 날짜' }[it.source] || '';
    box.innerHTML = `
      <img alt="">
      <div class="body">
        <div class="row"><label>날짜</label><input type="date"></div>
        <div class="row"><label>메모</label><textarea rows="2" placeholder="오늘의 코디 메모"></textarea></div>
        <div class="src"></div>
        <div class="acts"><button class="btn danger">삭제</button><button class="btn primary">저장</button></div>
      </div>`;
    box.querySelector('img').src = urlFor(it, 'full');
    const dateIn = box.querySelector('input'); dateIn.value = it.date;
    const memoIn = box.querySelector('textarea'); memoIn.value = it.memo || '';
    box.querySelector('.src').textContent = srcText;
    box.querySelector('.primary').onclick = async ()=>{
      if(!dateIn.value){ toast('날짜를 골라주세요'); return; }
      const moved = dateIn.value !== it.date;
      const updated = { ...it, memo: memoIn.value.trim(), date: dateIn.value, source: moved ? 'manual' : it.source };
      await dbPut(updated);
      items = await dbAll(); render();
      if(moved){ const [yy,mm]=dateIn.value.split('-').map(Number); view={y:yy,m:mm-1}; render(); toast(`${fmtKo(dateIn.value)}로 옮겼어요`); }
      else toast('저장했어요');
      openDay(key);
    };
    box.querySelector('.danger').onclick = async ()=>{
      if(!confirm('이 사진을 삭제할까요?')) return;
      await dbDel(it.id); dropUrls(it.id);
      items = await dbAll(); render(); openDay(key); toast('삭제했어요');
    };
    body.appendChild(box);
  }
  document.getElementById('modalBg').classList.add('open');
}
function closeModal(){ openDate=null; document.getElementById('modalBg').classList.remove('open'); }
let pendingDay = null;
function pickForDay(key){ pendingDay = key; document.getElementById('dayFileInput').click(); }

/* ---------- 백업 ---------- */
const blobToDataURL = b=> new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(b); });
async function exportData(){
  if(!items.length){ toast('저장된 사진이 없어요'); return; }
  toast('백업 파일 만드는 중…', 60000);
  const out = [];
  for(const it of items) out.push({ ...it, full: await blobToDataURL(it.full), thumb: await blobToDataURL(it.thumb) });
  const blob = new Blob([JSON.stringify({ app:'ootd', version:1, items: out })], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `ootd-backup-${ymd(new Date())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(a.href), 5000);
  toast(`사진 ${items.length}장을 백업했어요`);
}
async function importData(file){
  try{
    const data = JSON.parse(await file.text());
    if(data.app!=='ootd' || !Array.isArray(data.items)) throw 0;
    const existing = new Set(items.map(i=>i.id));
    let n=0;
    for(const it of data.items){
      if(existing.has(it.id)) continue;
      const full = await (await fetch(it.full)).blob();
      const thumb = await (await fetch(it.thumb)).blob();
      await dbPut({ ...it, full, thumb }); n++;
    }
    items = await dbAll(); render();
    toast(`사진 ${n}장을 불러왔어요`);
  }catch(e){ toast('백업 파일을 읽을 수 없어요'); }
}

/* ---------- 기타 ---------- */
let toastTimer;
function toast(msg, ms=2200){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=> t.classList.remove('show'), ms);
}

document.getElementById('prevBtn').onclick = ()=>{ view.m--; if(view.m<0){view.m=11;view.y--;} render(); };
document.getElementById('nextBtn').onclick = ()=>{ view.m++; if(view.m>11){view.m=0;view.y++;} render(); };
document.getElementById('todayBtn').onclick = ()=>{ const d=new Date(); view={y:d.getFullYear(),m:d.getMonth()}; render(); };
document.getElementById('addBtn').onclick = ()=> document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = e=>{ addFiles(e.target.files); e.target.value=''; };
document.getElementById('dayFileInput').onchange = e=>{ const d = pendingDay || openDate; pendingDay=null; addFiles(e.target.files, d); e.target.value=''; };
document.getElementById('addToDayBtn').onclick = ()=> pickForDay(openDate);
document.getElementById('closeBtn').onclick = closeModal;
document.getElementById('modalBg').onclick = e=>{ if(e.target.id==='modalBg') closeModal(); };
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
document.getElementById('exportBtn').onclick = exportData;
document.getElementById('importBtn').onclick = ()=> document.getElementById('importInput').click();
document.getElementById('importInput').onchange = e=>{ if(e.target.files[0]) importData(e.target.files[0]); e.target.value=''; };

// 스와이프로 달 넘기기
(()=>{
  let sx=null, sy=0;
  const g = document.getElementById('grid');
  g.addEventListener('touchstart', e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; }, {passive:true});
  g.addEventListener('touchend', e=>{
    if(sx===null) return;
    const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; sx=null;
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5) document.getElementById(dx<0?'nextBtn':'prevBtn').click();
  });
})();

(async ()=>{
  try{ items = await dbAll(); }catch(e){ toast('이 브라우저에서는 저장 기능을 쓸 수 없어요'); }
  render();
})();
</script>
