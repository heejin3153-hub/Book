<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<script>
  (function(){
    try{
      var mode = localStorage.getItem('theme-mode') || 'light';
      var actual = mode;
      if(mode==='system'){
        actual = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', actual);
    }catch(e){}
  })();
</script>
<title>독서기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#fafafa; --surface:#ffffff; --border:#ececec; --border-2:#e2e2e2;
    --text:#18181b; --text-muted:#8a8a92;
    --accent:#5b5bd6; --accent-soft:#eeeeff; --accent-dark:#4747b8;
    --danger:#e05252; --star:#f0ac1f; --green:#3fa88a;
    --radius:16px; --safe-b: env(safe-area-inset-bottom, 0px);
  }
  html[data-theme="dark"]{
    color-scheme: dark;
    --bg:#111114; --surface:#1c1c21; --border:#2a2a30; --border-2:#35353d;
    --text:#eeeef0; --text-muted:#9494a0;
    --accent:#8080e8; --accent-soft:#26264a; --accent-dark:#a0a0f0;
    --danger:#f27272; --star:#f5bb45; --green:#57c397;
  }
  html[data-theme="light"]{ color-scheme: light; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Inter',-apple-system,'Malgun Gothic',sans-serif;
    min-height:100vh; min-height:100dvh; padding-bottom:calc(100px + var(--safe-b)); -webkit-font-smoothing:antialiased; touch-action:manipulation; }
  .wrap{ max-width:600px; margin:0 auto; padding:28px 16px 0; }

  .header-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .header-menu{ background:var(--surface); border:1px solid var(--border); color:var(--text-muted); width:34px; height:34px; border-radius:10px; font-size:17px; cursor:pointer; flex-shrink:0; line-height:1; }
  h1.title{ font-size:23px; margin:0 0 4px; font-weight:800; letter-spacing:-0.02em; }
  .subtitle{ color:var(--text-muted); font-size:13px; margin:0 0 22px; font-weight:500; }

  .tabs{ display:flex; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:4px; margin-bottom:18px; position:sticky; top:10px; z-index:10; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .tab{ flex:1 0 auto; min-width:64px; background:none; border:none; color:var(--text-muted); font-size:12.5px; font-weight:600; padding:10px 8px; cursor:pointer; border-radius:9px; white-space:nowrap; }
  .tab.active{ color:var(--text); background:var(--bg); }

  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:22px 16px; box-shadow:0 1px 2px rgba(0,0,0,0.02); }

  .stats{ text-align:center; margin-bottom:18px; }
  .stats .num{ font-size:38px; font-weight:800; line-height:1; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; }
  .stats .label{ color:var(--text-muted); font-size:12px; margin-top:8px; font-weight:600; }
  .stats .height{ display:inline-flex; align-items:center; gap:5px; margin-top:12px; padding:6px 12px; background:var(--accent-soft); color:var(--accent-dark); border-radius:20px; font-size:12px; font-weight:700; }

  .section-h{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .section-h .h{ font-size:11px; letter-spacing:0.03em; text-transform:uppercase; color:var(--text-muted); font-weight:700; }
  .icon-btn{ background:var(--bg); border:1px solid var(--border); color:var(--text-muted); border-radius:8px; padding:6px 10px; font-size:11px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:4px; }
  .icon-btn:active{ background:var(--accent-soft); color:var(--accent-dark); }

  /* 읽는 중 */
  .reading-list{ margin-bottom:22px; }
  .reading-card{ display:flex; gap:10px; align-items:center; background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:10px; margin-bottom:8px; }
  .reading-card .cov{ width:38px; height:54px; border-radius:5px; object-fit:cover; background:var(--border-2); flex-shrink:0; }
  .reading-card .covph{ width:38px; height:54px; border-radius:5px; flex-shrink:0; }
  .reading-card .rt{ font-size:13px; font-weight:700; cursor:pointer; }
  .reading-card .rd{ font-size:11px; color:var(--text-muted); margin-top:2px; }
  .reading-card .done-btn{ margin-left:auto; background:var(--green); color:#fff; border:none; border-radius:8px; padding:8px 12px; font-size:11.5px; font-weight:700; cursor:pointer; flex-shrink:0; }

  /* 태그 필터 */
  .tag-filters{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px; }
  .period-row{ display:flex; gap:8px; margin-bottom:16px; }
  .period-select{ background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:7px 10px; font-size:12px; font-weight:600; color:var(--text); font-family:'Inter',sans-serif; }
  .tag-chip{ background:var(--bg); border:1px solid var(--border); color:var(--text-muted); border-radius:20px; padding:6px 12px; font-size:11.5px; font-weight:600; cursor:pointer; }
  .tag-chip.on{ background:var(--accent); color:#fff; border-color:var(--accent); }

  /* 책 쌓기 */
  .shelf-area{ min-height:70px; overflow-x:hidden; }
  .stack{ display:flex; flex-direction:column-reverse; gap:4px; align-items:center; }
  .spine{ position:relative; display:flex; align-items:center; justify-content:center; border-radius:6px; cursor:pointer; overflow:hidden; clip-path:inset(0 0 0 0 round 6px); box-shadow:0 2px 3px rgba(0,0,0,0.16), inset 0 1px 0 rgba(255,255,255,0.22); }
  .spine-cover{ position:absolute; inset:-4px; background-size:cover; background-position:center; filter:blur(4px) brightness(0.7) saturate(1.05); z-index:0; }
  .spine-real{ position:absolute; inset:0; overflow:hidden; clip-path:inset(0); z-index:0; }
  .spine-real img{ position:absolute; top:50%; left:50%; object-fit:contain; pointer-events:none; }
  .spine::after{ content:''; position:absolute; right:0; top:2px; bottom:2px; width:5px; background:repeating-linear-gradient(180deg,#efe8d8 0px,#efe8d8 1px,#e0d7c1 1px,#e0d7c1 2px); border-radius:0 4px 4px 0; z-index:1; }
  /* 실제 책등 사진이 있을 땐 사진 자체가 진짜 디테일이라, 가짜 그림자/모서리/페이지단면 장식을 다 뺌 */
  .spine.spine-noframe{ border-radius:0; box-shadow:none; }
  .spine.spine-noframe::after{ content:none; }
  .spine-label{ position:relative; z-index:2; display:flex; align-items:center; gap:8px; padding:0 14px 0 16px; width:100%; margin-right:5px; color:#fff; font-size:12.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-shadow:0 1px 3px rgba(0,0,0,0.4); }
  .spine-label .t{ overflow:hidden; text-overflow:ellipsis; }
  .spine-label .p{ margin-left:auto; font-size:11px; opacity:0.9; font-variant-numeric:tabular-nums; flex-shrink:0; }

  .empty-shelf{ text-align:center; color:var(--text-muted); font-size:13px; line-height:1.7; padding:40px 10px; border:1.5px dashed var(--border-2); border-radius:12px; font-weight:500; }

  .booklist{ margin-top:22px; padding-top:18px; border-top:1px solid var(--border); }
  .book-item{ border-bottom:1px solid var(--border); padding:11px 0; }
  .book-item:last-child{ border-bottom:none; }
  .book-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; cursor:pointer; }
  .book-row:last-child{ border-bottom:none; }
  .book-row .bt{ font-size:13.5px; font-weight:600; color:var(--text); }
  .book-row .bd{ font-size:11px; color:var(--text-muted); margin-top:2px; }
  .book-row .tags{ margin-top:4px; }
  .book-row .tags span{ font-size:10px; background:var(--accent-soft); color:var(--accent-dark); padding:2px 7px; border-radius:8px; margin-right:4px; font-weight:600; }
  .book-row .stars{ color:var(--star); font-size:14px; margin-top:3px; letter-spacing:1px; flex-shrink:0; text-align:right; }
  .book-row .rv{ font-size:12.5px; color:var(--text-muted); margin-top:4px; font-style:italic; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; max-width:100%; white-space:pre-line; }
  .book-row .bp{ font-size:11px; color:var(--text-muted); font-weight:600; font-variant-numeric:tabular-nums; }

  /* 캘린더 */
  .cal-summary{ display:flex; gap:8px; margin-bottom:18px; }
  .cal-summary .box{ flex:1; background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:12px 10px; text-align:center; }
  .cal-summary .box .v{ font-size:20px; font-weight:800; letter-spacing:-0.01em; font-variant-numeric:tabular-nums; }
  .cal-summary .box .l{ font-size:10.5px; color:var(--text-muted); font-weight:600; margin-top:3px; }
  .cal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .cal-head .m{ font-size:16px; font-weight:700; letter-spacing:-0.01em; }
  .cal-nav{ background:var(--bg); border:1px solid var(--border); color:var(--text); width:32px; height:32px; border-radius:8px; cursor:pointer; font-size:13px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:20px; }
  .cal-dow{ text-align:center; font-size:10px; color:var(--text-muted); padding:2px 0 6px; font-weight:600; }
  .cal-cell{ aspect-ratio:2/3; border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:10.5px; border:1px solid var(--border); position:relative; font-weight:600; overflow:hidden; cursor:default; }
  .cal-cell.other{ opacity:0.32; }
  .cal-cell .d{ color:var(--text-muted); position:relative; z-index:1; }
  .cal-cell.has{ border-color:transparent; cursor:pointer; }
  .cal-cell.has .d{ color:rgba(255,255,255,0.97); text-shadow:0 1px 3px rgba(0,0,0,0.4); }
  .cal-cell .cover-img{ position:absolute; top:0; left:0; right:0; bottom:0; width:100%; height:100%; margin:0; padding:0; display:block; object-fit:cover; }
  .cal-cell .cover-shade{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,0.45) 100%); }
  .cal-more{ position:absolute; bottom:2px; right:3px; font-size:7.5px; color:#fff; font-weight:800; z-index:1; text-shadow:0 1px 2px rgba(0,0,0,0.5); }
  .cal-cell.multi{ display:flex; flex-direction:row; align-items:stretch; justify-content:flex-start; padding:0; gap:1px; background:var(--border); }
  .cal-cell.multi .mini-cover{ flex:1; min-width:0; position:relative; overflow:hidden; cursor:pointer; }
  .cal-cell.multi .mini-cover img{ position:absolute; top:0; left:0; right:0; bottom:0; width:100%; height:100%; margin:0; padding:0; display:block; object-fit:cover; }
  .cal-cell.multi .d{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:2; font-size:10px; color:#fff; font-weight:800; text-shadow:0 1px 3px rgba(0,0,0,0.7); background:rgba(0,0,0,0.4); width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .cal-cell.multi .cal-more{ top:2px; right:2px; bottom:auto; background:rgba(0,0,0,0.55); border-radius:6px; padding:0 4px; line-height:1.4; }
  .month-list{ margin-top:4px; }
  .month-empty{ text-align:center; color:var(--text-muted); font-size:13px; padding:24px 0; font-weight:500; }
  .month-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); cursor:pointer; }
  .month-row:last-child{ border-bottom:none; }
  .month-row .cov{ width:30px; height:42px; border-radius:4px; flex-shrink:0; object-fit:cover; background:var(--border); }
  .month-row .chip{ width:5px; height:30px; border-radius:3px; flex-shrink:0; }
  .month-row .bt{ font-size:13px; font-weight:600; }
  .month-row .bd{ font-size:11px; color:var(--text-muted); margin-top:1px; }

  /* 통계 */
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:22px; }
  .stat-box{ background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:14px; text-align:center; }
  .stat-box-editable{ cursor:pointer; border:1.5px dashed var(--border-2); }
  .stat-box-editable:active{ background:var(--accent-soft); }
  .stat-box-editable .v{ max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .edit-pencil{ opacity:0.6; font-size:9px; }
  .stat-box .v{ font-size:22px; font-weight:800; letter-spacing:-0.01em; }
  .stat-box .l{ font-size:10.5px; color:var(--text-muted); font-weight:600; margin-top:4px; }
  .bar-chart{ display:flex; align-items:flex-end; gap:5px; height:110px; margin-bottom:6px; }
  .bar-chart .bar-wrap{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
  .bar-chart .bar{ width:100%; background:var(--accent); border-radius:4px 4px 0 0; min-height:2px; }
  .bar-chart .bn{ font-size:9px; color:var(--text-muted); margin-top:2px; }
  .bar-rating{ font-size:9px; color:var(--star); font-weight:700; margin-bottom:2px; white-space:nowrap; }
  .taglist{ display:flex; flex-direction:column; gap:8px; margin-top:6px; }
  .tagrow{ display:flex; justify-content:space-between; align-items:center; font-size:12.5px; }
  .tagrow .name{ font-weight:600; }
  .tagrow .cnt{ color:var(--text-muted); font-variant-numeric:tabular-nums; }
  .stat-empty{ text-align:center; color:var(--text-muted); font-size:13px; padding:30px 0; }
  .book-info-btn{ width:100%; background:var(--accent-soft); color:var(--accent-dark); border:none; border-radius:10px; padding:11px; font-size:13px; font-weight:700; cursor:pointer; margin-bottom:14px; }
  .info-section{ margin-bottom:20px; }
  .info-section .h{ font-size:11px; letter-spacing:0.03em; text-transform:uppercase; color:var(--text-muted); font-weight:700; margin-bottom:8px; }
  .info-section .body{ font-size:13.5px; color:var(--text); line-height:1.7; white-space:pre-line; }
  .info-subtitle{ font-size:13px; color:var(--text-muted); margin-bottom:14px; }
  .info-loading{ text-align:center; color:var(--text-muted); font-size:13px; padding:40px 0; }
  .info-phrase{ background:var(--bg); border-radius:10px; padding:12px; margin-bottom:8px; font-size:13px; line-height:1.6; }
  .info-phrase .pg{ font-size:11px; color:var(--accent); font-weight:700; margin-bottom:4px; }

  /* 위시리스트 */
  .wish-row{ display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--border); }
  .wish-row:last-child{ border-bottom:none; }
  .wish-row .cov{ width:32px; height:46px; border-radius:4px; object-fit:cover; background:var(--border-2); flex-shrink:0; }
  .wish-row .covph{ width:32px; height:46px; border-radius:4px; background:var(--border-2); flex-shrink:0; }
  .wish-row .bt{ font-size:13px; font-weight:700; cursor:pointer; }
  .wish-row .bd{ font-size:11px; color:var(--text-muted); margin-top:1px; }
  .wish-row .start-btn{ margin-left:auto; background:var(--accent); color:#fff; border:none; border-radius:8px; padding:8px 12px; font-size:11.5px; font-weight:700; cursor:pointer; flex-shrink:0; }
  .wish-comment{ font-size:11.5px; color:var(--text-muted); margin-top:3px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .folder-edit{ margin-left:4px; opacity:0.85; }
  .folder-add{ border-style:dashed; color:var(--accent); }

  .fab{ position:fixed; right:18px; bottom:calc(20px + var(--safe-b)); width:56px; height:56px; border-radius:50%; background:var(--accent); border:none; color:#fff; font-size:27px; cursor:pointer; box-shadow:0 8px 20px rgba(91,91,214,0.35), 0 2px 6px rgba(0,0,0,0.08); display:flex; align-items:center; justify-content:center; z-index:20; }
  .fab:active{ transform:scale(0.95); }

  .modal-back{ position:fixed; inset:0; background:rgba(24,24,27,0.4); backdrop-filter:blur(3px); display:flex; align-items:flex-end; justify-content:center; z-index:50; overscroll-behavior:contain; touch-action:none; }
  @media(min-width:640px){ .modal-back{ align-items:center; padding:20px; } }
  .card{ background:var(--surface); color:var(--text); width:100%; max-width:440px; border-radius:20px 20px 0 0; max-height:94vh; max-height:94dvh; box-shadow:0 -10px 40px rgba(0,0,0,0.15); display:flex; flex-direction:column; overflow:hidden; touch-action:pan-y; }
  @media(min-width:640px){ .card{ border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,0.2); } }
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; padding:26px 18px 14px; flex-shrink:0; background:var(--surface); box-shadow:0 1px 0 var(--border); position:relative; z-index:2; cursor:grab; touch-action:none; }
  .card-top::before{ content:''; position:absolute; top:7px; left:50%; transform:translateX(-50%); width:36px; height:4px; border-radius:2px; background:var(--border-2); }
  @media(min-width:640px){ .card-top{ padding:26px 24px 16px; } }
  .card-body{ flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; touch-action:pan-y; padding:14px 18px 18px; }
  @media(min-width:640px){ .card-body{ padding:16px 24px 20px; } }
  .card-footer{ flex-shrink:0; padding:12px 18px calc(14px + var(--safe-b)); border-top:1px solid var(--border); background:var(--surface); }
  @media(min-width:640px){ .card-footer{ padding:14px 24px 20px; } }
  .card-top .ct{ font-size:17px; font-weight:800; letter-spacing:-0.01em; }
  .card-top .cs{ font-size:12px; color:var(--text-muted); margin-top:4px; font-weight:500; }
  .card-close{ background:var(--bg); border:none; width:30px; height:30px; border-radius:8px; font-size:18px; color:var(--text-muted); cursor:pointer; flex-shrink:0; }
  .card-divider{ border-top:1px solid var(--border); margin:16px 0; }

  .field{ margin-bottom:14px; }
  .field-row{ display:flex; gap:10px; align-items:flex-start; }
  .field-row .field{ flex:1 1 0; min-width:0; }
  .field-row .field input{ text-align:center; }
  .field label{ display:block; font-size:10.5px; letter-spacing:0.02em; text-transform:uppercase; color:var(--text-muted); font-weight:700; margin-bottom:6px; }
  .field input, .field select{ width:100%; border:1.5px solid var(--border-2); border-radius:10px; background:var(--bg); padding:12px; font-size:16px; color:var(--text); font-family:'Inter',sans-serif; outline:none; box-sizing:border-box; -webkit-appearance:none; appearance:none; text-align:center; }
  .field textarea{ width:100%; border:1.5px solid var(--border-2); border-radius:10px; background:var(--bg); padding:12px; font-size:16px; color:var(--text); font-family:'Inter',sans-serif; outline:none; box-sizing:border-box; }
  .field input[type="date"]{ min-width:0; padding:11px 10px; text-align:center; }
  #pagesInput, #tagsInput{ text-align:center; }
  .field textarea{ resize:vertical; min-height:96px; font-size:14px; line-height:1.5; }
  .field input:focus, .field textarea:focus{ border-color:var(--accent); background:var(--surface); }

  .status-picker{ display:flex; gap:6px; }
  .status-picker button{ flex:1; background:var(--bg); border:1.5px solid var(--border-2); color:var(--text-muted); border-radius:10px; padding:11px 4px; font-size:13px; font-weight:700; cursor:pointer; }
  .status-picker button.on{ background:var(--accent); border-color:var(--accent); color:#fff; }

  .search-row{ display:flex; gap:8px; align-items:flex-end; }
  .search-row .field{ flex:1; margin-bottom:0; }
  .btn-search{ background:var(--accent); color:#fff; border:none; border-radius:10px; padding:0 16px; font-size:13.5px; font-weight:700; cursor:pointer; white-space:nowrap; height:44px; }
  .btn-search:disabled{ opacity:0.5; }

  .results{ margin-top:12px; max-height:200px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .result-item{ display:flex; gap:10px; align-items:center; width:100%; text-align:left; background:var(--bg); border:1.5px solid var(--border); border-radius:12px; padding:8px 10px; margin-bottom:6px; cursor:pointer; }
  .result-item img{ width:32px; height:46px; object-fit:cover; border-radius:4px; flex-shrink:0; background:var(--border-2); }
  .result-item .rt{ font-size:13px; font-weight:700; color:var(--text); }

<script>
/* ---------------- 데이터 ---------------- */
let books = JSON.parse(localStorage.getItem('reading-books') || '[]');
// 이전 버전 데이터 마이그레이션 (status, tags 없는 경우 보정)
books = books.map(b => ({
  status: 'completed', tags: [], startDate: null,
  ...b,
  tags: b.tags || []
}));
saveBooksRaw();

let currentMonth = new Date();
let currentView = 'shelf';
let selectedCover = null, selectedDepthMm = null, selectedSpineMm = null;
let selectedAuthor = '', selectedAladinItemId = null, selectedExtraInfo = null;
let selectedSpineImage = null, spineImageLoaded = false;
let currentRating = 0, currentStatus = 'completed', editingId = null;

// 팝업이 열려있는 동안 배경(body) 스크롤을 막고, 팝업 안에서만 스크롤되게 함
let lockedScrollY = 0, modalLockCount = 0;
function lockBodyScroll(){
  if(modalLockCount===0){
    lockedScrollY = window.scrollY;
    document.body.style.position = 'fixed';
    document.body.style.top = `-${lockedScrollY}px`;
    document.body.style.left = '0';
    document.body.style.right = '0';
    document.body.style.width = '100%';
  }
  modalLockCount++;
}
function unlockBodyScroll(){
  modalLockCount = Math.max(0, modalLockCount-1);
  if(modalLockCount===0){
    document.body.style.position = '';
    document.body.style.top = '';
    document.body.style.left = '';
    document.body.style.right = '';
    document.body.style.width = '';
    window.scrollTo(0, lockedScrollY);
  }
}
let currentQuotes = [];
let expandedBooks = new Set();
let startDateManuallyEdited = false;
let activeTags = [];

/* ---------------- 위시리스트 폴더 ---------------- */
let wishFolders = JSON.parse(localStorage.getItem('wish-folders') || '[]');
let activeWishFolder = 'all';
function saveFolders(){ localStorage.setItem('wish-folders', JSON.stringify(wishFolders)); pushMetaToCloud(); }

function addWishFolder(){
  const name = prompt('새 폴더 이름을 입력해주세요');
  if(name===null) return;
  const trimmed = name.trim();
  if(!trimmed) return;
  wishFolders.push({ id: Date.now(), name: trimmed });
  saveFolders();
  renderWishlist();
}
function editWishFolder(id, event){
  if(event) event.stopPropagation();
  const folder = wishFolders.find(f=>f.id===id);
  if(!folder) return;
  const name = prompt('폴더 이름 수정 (빈 칸으로 저장하면 삭제돼요)', folder.name);
  if(name===null) return;
  const trimmed = name.trim();
  if(!trimmed){
    if(!confirm(`"${folder.name}" 폴더를 삭제할까요? 안에 있던 책은 삭제되지 않고 미분류로 이동해요.`)) return;
    wishFolders = wishFolders.filter(f=>f.id!==id);
    const affected = books.filter(b=> b.folderId===id);
    affected.forEach(b=>{ b.folderId=null; });
    if(activeWishFolder===id) activeWishFolder='all';
    saveBooksRaw();
    saveFolders();
    affected.forEach(b=> saveBookToCloud(b));
    renderWishlist();
    return;
  }
  folder.name = trimmed;
  saveFolders();
  renderWishlist();
}
function selectWishFolder(id){ activeWishFolder = id; renderWishlist(); }
function renderWishFolderOptions(selectedId){
  const el = document.getElementById('wishFolderSelectField');
  if(!el) return;
  el.innerHTML = `<option value="">미분류</option>` +
    wishFolders.map(f=>`<option value="${f.id}" ${String(selectedId)===String(f.id)?'selected':''}>${escapeHtml(f.name)}</option>`).join('');
}


const DEFAULT_TITLE = '독서기록';
const DEFAULT_SUBTITLE = '책을 검색하면 페이지 수를 자동으로 가져와요';
const PALETTE = ['#5b5bd6','#e0748c','#3fa88a','#e8a23f','#4a90d9','#9b6fd6','#e0645a','#3fb5b5'];

function colorFor(seed){ let h=0; for(let i=0;i<seed.length;i++){ h=(h*31+seed.charCodeAt(i))>>>0; } return PALETTE[h%PALETTE.length]; }
function widthFor(book){
  // 폭은 대충 고정 (78~86% 사이 살짝만 변주) - 지그재그는 offsetFor가 담당
  let h=0; const seed=book.title;
  for(let i=0;i<seed.length;i++){ h=(h*17+seed.charCodeAt(i))>>>0; }
  return 78 + (h%9);
}
function offsetFor(book){
  // 책마다 좌우로 살짝 어긋나게 배치해서 지그재그로 쌓인 느낌을 줌 (-9% ~ +9%)
  // id를 섞어서 제목이 같은 책(같은 책을 여러 권 추가한 경우)도 서로 다르게 어긋나게 함
  let h=0; const seed='zz'+book.id+book.title;
  for(let i=0;i<seed.length;i++){ h=(h*31+seed.charCodeAt(i))>>>0; }
  return (h%19) - 9;
}
const MM_PER_PAGE=0.07, COVER_MM=3;
function thicknessMm(pages){ return pages*MM_PER_PAGE+COVER_MM; }
const PX_PER_MM=1.8;
function spineHeightPx(book){ const mm=book.depthMm||thicknessMm(book.pages); return Math.max(26, Math.min(mm*PX_PER_MM,150)); }
// 화면(패널) 실제 폭에 맞춰 두께를 비례 확대/축소 - 아이패드처럼 폭이 넓어져도 비율이 그대로 유지되게 함
function currentPanelScale(){
  const panel = document.querySelector('.panel');
  if(!panel || !panel.clientWidth) return 1;
  return panel.clientWidth / 340; // 340px를 기준 폭으로 삼음 (일반적인 모바일 폭)
}
function heightLabel(totalPages,bookCount){
  const cm=((totalPages*MM_PER_PAGE)+(bookCount*COVER_MM))/10;
  if(cm<1) return null;
  return cm>=100 ? `${(cm/100).toFixed(2)}m` : `${cm.toFixed(1)}cm`;
}

const HEIGHT_OBJECTS = [
  {name:'아이폰', emoji:'📱', cm:15},
  {name:'아이패드', emoji:'📱', cm:25},
  {name:'A4 용지', emoji:'📄', cm:30},
  {name:'볼링핀', emoji:'🎳', cm:38},
  {name:'신생아 키', emoji:'👶', cm:50},
  {name:'우산', emoji:'☂️', cm:85},
  {name:'킥보드', emoji:'🛴', cm:85},
  {name:'기타', emoji:'🎸', cm:100},
  {name:'초등학생 1학년 키', emoji:'🎒', cm:120},
  {name:'스노보드', emoji:'🏂', cm:150},
  {name:'성인 키', emoji:'🧍', cm:165},
  {name:'냉장고', emoji:'🧊', cm:180},
  {name:'현관문', emoji:'🚪', cm:200},
  {name:'농구 골대', emoji:'🏀', cm:305},
  {name:'버스 높이', emoji:'🚌', cm:330},
  {name:'2층 건물', emoji:'🏠', cm:600},
  {name:'전봇대', emoji:'🔌', cm:800},
];

function heightObjectLabel(totalPages,bookCount){
  const cm=((totalPages*MM_PER_PAGE)+(bookCount*COVER_MM))/10;
  if(cm<8) return null;
  let best=null, bestDiff=Infinity;
  HEIGHT_OBJECTS.forEach(o=>{
    const diff = Math.abs(Math.log(cm/o.cm));
    if(diff<bestDiff){ bestDiff=diff; best=o; }
  });
  if(!best) return null;
  const ratio = cm/best.cm;
  if(ratio>=0.8 && ratio<=1.35) return `${best.emoji} ${best.name} 높이만큼이에요`;
  if(ratio>1.35) return `${best.emoji} ${best.name} ${ratio.toFixed(1)}개를 쌓은 높이예요`;
  return `${best.emoji} ${best.name} 높이의 ${Math.round(ratio*100)}% 정도예요`;
}
function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, c=> ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function starHtml(rating){
  rating = rating||0;
  const pct = Math.max(0, Math.min(100, (rating/5)*100));
  return `<span class="star-display"><span class="bg">★★★★★</span><span class="fg" style="width:${pct}%">★★★★★</span></span>`;
}
function toLocalDateStr(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }

function extractDominantColor(url){
  return new Promise((resolve)=>{
    try{
      const img=new Image(); img.crossOrigin='anonymous';
      img.onload=()=>{
        try{
          const c=document.createElement('canvas'); c.width=16; c.height=16;
          const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,16,16);
          const data=ctx.getImageData(0,0,16,16).data;
          let r=0,g=0,b=0,n=0;
          for(let i=0;i<data.length;i+=4){ if(data[i+3]<100) continue; r+=data[i]; g+=data[i+1]; b+=data[i+2]; n++; }
          if(n===0){ resolve(null); return; }
          r=Math.round(r/n); g=Math.round(g/n); b=Math.round(b/n);
          const lum=(r*299+g*587+b*114)/1000;
          if(lum>235||lum<25){ resolve(null); return; }
          resolve('#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join(''));
        }catch(e){ resolve(null); }
      };
      img.onerror=()=>resolve(null);
      img.src = url ? `/api/image-proxy?url=${encodeURIComponent(url)}` : url; // 프록시를 거쳐야 CORS 문제 없이 픽셀을 읽을 수 있음
    }catch(e){ resolve(null); }
  });
}

// 기존에 등록된 책들(알라딘으로 추가했지만 spineImage가 없는 책)의 예스24 책등 이미지를 한 번씩 조회해서 채워넣음
// force=true면 이미 "못 찾음(null)"으로 표시된 책도 다시 조회함 (수동 새로고침 버튼용)
let spineBackfillRunning = false;
async function backfillSpineImages(force=false){
  if(spineBackfillRunning) return false;
  const targets = books.filter(b => b.aladinItemId && (force || b.spineImage === undefined));
  if(targets.length===0) return false;
  spineBackfillRunning = true;
  let changed = false;
  for(const book of targets){
    try{
      const detailRes = await fetch(`/api/detail/${book.aladinItemId}`);
      const detail = await detailRes.json();
      let spineUrl = null;
      if(detail.isbn){
        const q = `isbn=${encodeURIComponent(detail.isbn)}&title=${encodeURIComponent(detail.title||book.title||'')}&author=${encodeURIComponent(detail.author||book.author||'')}`;
        const spineRes = await fetch(`/api/yes24-spine?${q}`);
        const spineData = await spineRes.json();
        spineUrl = spineData.spineUrl || null;
      }
      book.spineImage = spineUrl; // 못 찾아도 null로 표시해 다음부턴 다시 조회하지 않음
      changed = true;
      saveBookToCloud(book);
    }catch(e){ /* 네트워크 오류 등으로 실패한 건 값을 건드리지 않아 다음에 다시 시도되게 함 */ }
  }
  if(changed) saveBooksRaw();
  spineBackfillRunning = false;
  return changed;
}
async function manualRefreshSpineImages(btn){
  if(btn){ btn.disabled = true; btn.textContent = '조회 중...'; }
  const changed = await backfillSpineImages(true);
  if(currentView==='shelf') renderShelf();
  if(btn){ btn.disabled = false; btn.textContent = '📚 책등 이미지 다시 조회하기'; }

}

function exportData(){
  const blob = new Blob([JSON.stringify(books, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  a.href = url;
  a.download = `독서기록-백업-${toLocalDateStr(d)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importData(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const imported = JSON.parse(e.target.result);
      if(!Array.isArray(imported)) throw new Error('형식 오류');
      const existingIds = new Set(books.map(b=>b.id));
      const newBooks = [];
      imported.forEach(b=>{
        if(b && b.title && !existingIds.has(b.id)){
          const nb = { status:'completed', tags:[], startDate:null, ...b };
          books.push(nb);
          newBooks.push(nb);
          existingIds.add(b.id);
        }
      });
      saveBooksRaw();
      if(newBooks.length>0 && currentUser && fbDb){
        const batch = fbDb.batch();
        newBooks.forEach(b=> batch.set(booksCollection().doc(String(b.id)), b));
        await batch.commit();
      }
      render();
      alert(`${newBooks.length}권을 가져왔어요! (중복은 자동으로 건너뜀)`);
    }catch(err){
      alert('파일을 읽을 수 없어요. 이 앱에서 내보낸 JSON 파일인지 확인해주세요.');
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

function categoryToTags(categoryName){
  if(!categoryName) return [];
  const rawParts = categoryName.split('>').map(p=>p.trim()).filter(Boolean);
  const skip = new Set(['국내도서','외국도서','eBook']);
  const parts = rawParts.filter(p=>!skip.has(p));
  // "소설/시/희곡"처럼 여러 장르가 슬래시로 묶인 대분류명은 태그로 쓰기엔 부정확하니,
  // 더 구체적인(대하소설/한국소설 등) 하위 분류가 있으면 그걸 우선 사용
  const specific = parts.filter(p=>!p.includes('/'));
  const useParts = specific.length>0 ? specific : parts.flatMap(p=>p.split('/'));
  const tags = useParts.map(t=>t.trim()).filter(Boolean);
  // 가장 구체적인(뒤쪽) 태그를 최대 4개까지
  return [...new Set(tags)].slice(-4);
}

  document.getElementById('pagesInput').value=''; document.getElementById('pagesInput').placeholder='가져오는 중...';
  document.getElementById('tagsInput').value = categoryToTags(book.categoryName).join(', ');
  selectedCover = book.cover||null; selectedDepthMm=null; selectedSpineMm=null;
  selectedAuthor = book.author || ''; selectedAladinItemId = book.itemId || null;
  selectedExtraInfo = null; // 책소개/줄거리/책속에서 등은 "자세히 보기" 누를 때 불러옴
  selectedSpineImage = null; spineImageLoaded = false;

  // 책을 고르면 검색창은 접고, 필요하면 다시 열 수 있게 토글 버튼을 보여줌
  document.getElementById('searchSection').classList.add('hidden');
  document.getElementById('reSearchToggle').classList.remove('hidden');

  try{
    const [res, spineRes] = await Promise.all([
      fetch(`/api/detail/${book.itemId}`),
      book.isbn ? fetch(`/api/yes24-spine?isbn=${encodeURIComponent(book.isbn)}&title=${encodeURIComponent(book.title||'')}&author=${encodeURIComponent(book.author||'')}`) : Promise.resolve(null)
    ]);
    const data = await res.json();
    if(data.cover) selectedCover = data.cover;
    if(data.depthMm) selectedDepthMm = data.depthMm;
    if(data.heightMm) selectedSpineMm = data.heightMm;
    if(data.author) selectedAuthor = data.author;
    if(data.categoryName){ document.getElementById('tagsInput').value = categoryToTags(data.categoryName).join(', '); }
    if(data.pages && data.pages>0){ document.getElementById('pagesInput').value = data.pages; }
    else{ document.getElementById('pagesInput').placeholder='예: 472'; alert('페이지 수를 찾을 수 없어요. 직접 입력해주세요.'); }
    if(spineRes){ const spineData = await spineRes.json(); selectedSpineImage = spineData.spineUrl || null; spineImageLoaded = true; }
    renderBookInfoButton();
  }catch(e){ document.getElementById('pagesInput').placeholder='예: 472'; alert('페이지 수 조회 실패. 직접 입력해주세요.'); }
}

/* ---------------- 저장 ---------------- */
async function saveBook(){
  const title = document.getElementById('titleInput').value.trim();
  if(!title){ alert('책 제목을 입력해주세요!'); return; }

  const pages = parseInt(document.getElementById('pagesInput').value) || 0;
  if(currentStatus!=='wishlist' && (!pages || pages<=0)){ alert('올바른 페이지 수를 입력해주세요!'); return; }

  const tags = document.getElementById('tagsInput').value.split(',').map(t=>t.trim()).filter(Boolean);
  const startDate = document.getElementById('startDateInput').value || null;
  const completedDate = document.getElementById('dateInput').value || null;
  const review = document.getElementById('reviewInput').value.trim();
  const wishComment = document.getElementById('wishCommentInput').value.trim();
  const folderSelect = document.getElementById('wishFolderSelectField');
  const folderId = (currentStatus==='wishlist' && folderSelect.value) ? Number(folderSelect.value) : null;
  const quotes = (currentStatus==='completed' || currentStatus==='reading') ? currentQuotes.filter(q=>q.text && q.text.trim()).map(q=>({page:(q.page||'').trim(), text:q.text.trim()})) : [];

  if(currentStatus==='completed' && !completedDate){ alert('완독 날짜를 입력해주세요!'); return; }
  if(currentStatus==='completed' && startDate && completedDate && new Date(startDate) > new Date(completedDate)){
    alert('읽기 시작한 날짜가 완독 날짜보다 늦을 수 없어요. 날짜를 확인해주세요.');
    return;
  }

  let color = colorFor(title);
  if(selectedCover){ const extracted = await extractDominantColor(selectedCover); if(extracted) color = extracted; }

  const payload = {
    title, pages, tags, status: currentStatus,
    startDate: currentStatus==='wishlist' ? null : startDate,
    completedDate: currentStatus==='completed' ? completedDate : null,
    rating: currentStatus==='completed' ? currentRating : 0,
    review: currentStatus==='completed' ? review : '',
    wishComment: currentStatus==='wishlist' ? wishComment : (books.find(b=>b.id===editingId)?.wishComment || ''),
    folderId: currentStatus==='wishlist' ? folderId : (books.find(b=>b.id===editingId)?.folderId ?? null),
    quotes,
    cover: selectedCover, color,
    author: selectedAuthor || (books.find(b=>b.id===editingId)?.author || ''),
    aladinItemId: selectedAladinItemId || (books.find(b=>b.id===editingId)?.aladinItemId || null),
    depthMm: selectedDepthMm, spineMm: selectedSpineMm,
    // 예스24 책등 조회가 아직 안 끝났으면 spineImage를 아예 안 남겨서(undefined),
    // 나중에 새로고침할 때 다시 조회하도록 함 (조회 중 저장하면 못 찾은 걸로 영구 고정되는 버그 방지)
    ...(spineImageLoaded ? { spineImage: selectedSpineImage } : {})
  };

  let savedBook;
  if(editingId!==null){
    const idx = books.findIndex(b=>b.id===editingId);
    if(idx>-1){
      books[idx] = { ...books[idx], ...payload,
        cover: selectedCover || books[idx].cover,
        color: selectedCover ? color : books[idx].color,
        depthMm: selectedDepthMm || books[idx].depthMm,
        spineMm: selectedSpineMm || books[idx].spineMm,
        spineImage: spineImageLoaded ? selectedSpineImage : books[idx].spineImage };
      savedBook = books[idx];
    }
  }else{
    savedBook = { id: Date.now(), ...payload };
    books.push(savedBook);
  }
  saveBooksRaw();
  await saveBookToCloud(savedBook);
  closeAddModal(); render();
}

async function markWishStart(id){
  const book = books.find(b=>b.id===id);
  if(!book) return;
  book.status='reading'; book.startDate = new Date().toISOString().split('T')[0];
  saveBooksRaw();
  await saveBookToCloud(book);
  render();
}

function render(){
  if(currentView==='shelf') renderShelf();
  else if(currentView==='calendar') renderCalendar();
  else if(currentView==='stats') renderStats();
  else if(currentView==='wishlist') renderWishlist();
}

function allTags(list){
  const s = new Set();
  list.forEach(b => (b.tags||[]).forEach(t=>s.add(t)));
  return [...s];
}

/* ---------------- 책장 (책쌓기) ---------------- */
let periodYear = 'all', periodMonth = 'all', bookListSort = 'recent';

function getAvailableYears(list){
  const s = new Set();
  list.forEach(b=>{ if(b.completedDate) s.add(new Date(b.completedDate).getFullYear()); });
  return [...s].sort((a,b)=>b-a);
}
function inPeriod(book){
  if(periodYear==='all') return true;
  if(!book.completedDate) return false;
  const d = new Date(book.completedDate);
  if(String(d.getFullYear())!==periodYear) return false;
  if(periodMonth!=='all' && String(d.getMonth()+1)!==periodMonth) return false;
  return true;
}
function onPeriodYearChange(v){ periodYear=v; periodMonth='all'; renderShelf(); }
function onPeriodMonthChange(v){ periodMonth=v; renderShelf(); }
function setBookListSort(v){ bookListSort=v; renderShelf(); }
function sortedBookList(list){
  const arr=[...list];
  if(bookListSort==='recent') arr.sort((a,b)=> new Date(b.completedDate)-new Date(a.completedDate));
  else if(bookListSort==='oldest') arr.sort((a,b)=> new Date(a.completedDate)-new Date(b.completedDate));
  else if(bookListSort==='title') arr.sort((a,b)=> a.title.localeCompare(b.title,'ko'));
  else if(bookListSort==='rating') arr.sort((a,b)=> (b.rating||0)-(a.rating||0));
  return arr;
}

// 실제 책등 이미지는 세로로 긴 사진이라, 눕혀 쌓는 가로 막대 안에 맞게
// 반시계 방향으로 90도 돌려서 채워넣음. 두께(높이, h)는 페이지수/실제 사이즈 기준으로 그대로 두고,
// 박스의 "폭"은 그 이미지의 실제 가로세로 비율에 맞춰 계산함 - 두꺼운/얇은 책마다 폭이 다르게
// 나오는 게 실제 책장처럼 자연스러운 모습이고, 잘리지도 여백이 남지도 않게 정확히 맞아떨어짐.
// (화면 폭을 넘어서는 극단적인 경우에만 어쩔 수 없이 살짝 여백이 남을 수 있음)
function layoutRealSpines(){
  document.querySelectorAll('.spine-real').forEach(wrap=>{
    const img = wrap.querySelector('img');
    if(!img) return;
    const spineEl = wrap.closest('.spine');

    const fitWidthToImage = ()=>{
      if(!spineEl || !img.naturalWidth || !img.naturalHeight) return;
      const rowH = spineEl.offsetHeight;
      const stackEl = spineEl.closest('.stack');
      // 지그재그 오프셋(offsetFor, 자기 폭의 ±9%만큼 좌우로 밀림)이 화면 밖으로 안 넘어가게 안전 여유를 둠
      const maxW = stackEl ? stackEl.clientWidth * 0.84 : Infinity;
      const idealW = rowH * (img.naturalHeight / img.naturalWidth);
      spineEl.style.width = Math.min(idealW, maxW) + 'px';
      applyRotatedFit();
      img.style.opacity = '1'; // 크기를 다 맞춘 다음에만 보이게 해서 로딩 중 회색 박스가 안 비치게 함
    };
    const applyRotatedFit = ()=>{
      const w = wrap.offsetWidth, h = wrap.offsetHeight;
      if(w<=0 || h<=0) return;
      img.style.width = h+'px';
      img.style.height = w+'px';
      img.style.transform = 'translate(-50%,-50%) rotate(-90deg)';
    };

    if(img.complete && img.naturalWidth>0){
      fitWidthToImage();
    }else{
      img.addEventListener('load', fitWidthToImage, {once:true});
    }
  });
}
let spineResizeTimer = null;
window.addEventListener('resize', ()=>{
  clearTimeout(spineResizeTimer);
  spineResizeTimer = setTimeout(layoutRealSpines, 150);
});

function toggleTag(t){
  const i = activeTags.indexOf(t);
  if(i>-1) activeTags.splice(i,1); else activeTags.push(t);
  render();
}

/* ---------------- 캘린더 ---------------- */
function parseLocalDate(str){ return new Date(str+'T00:00:00'); }

function getBookRange(book){
  const start = book.startDate || book.completedDate;
  if(!start) return null;
  let end;
  if(book.status==='completed') end = book.completedDate || book.startDate;
  else if(book.status==='reading') end = toLocalDateStr(new Date()); // 진행중이면 오늘까지
  else return null;
  if(end < start) end = start;
  return { start, end };
}

function renderCalendar(){
  const year=currentMonth.getFullYear(), month=currentMonth.getMonth();
  const firstDay=new Date(year,month,1), lastDay=new Date(year,month+1,0);
  const startDate=new Date(firstDay); startDate.setDate(startDate.getDate()-firstDay.getDay());
  const endDate=new Date(lastDay); endDate.setDate(endDate.getDate()+(6-lastDay.getDay()));
  const monthStartStr = toLocalDateStr(firstDay), monthEndStr = toLocalDateStr(lastDay);

  // 완독/읽는 중인 책들의 "읽은 기간"을 날짜별로 펼쳐서 매핑 (시작일~완독일 전부 표시)
  const byDate = {};
  books.filter(b=> b.status==='completed' || b.status==='reading').forEach(b=>{
    const range = getBookRange(b);
    if(!range) return;
    if(range.end < monthStartStr || range.start > monthEndStr) return; // 이 달과 겹치지 않으면 스킵
    let cursor = parseLocalDate(range.start < monthStartStr ? monthStartStr : range.start);
    const rangeEnd = parseLocalDate(range.end > monthEndStr ? monthEndStr : range.end);
    while(cursor <= rangeEnd){
      const ds = toLocalDateStr(cursor);
      (byDate[ds] = byDate[ds]||[]).push(b);
      cursor.setDate(cursor.getDate()+1);
    }
  });

  const completedThisMonth = books.filter(b=>{ if(b.status!=='completed'||!b.completedDate) return false; const d=new Date(b.completedDate); return d.getFullYear()===year&&d.getMonth()===month; });
  const monthPages = completedThisMonth.reduce((s,b)=>s+(b.pages||0),0);

  const days=[]; const cursor=new Date(startDate);
  while(cursor<=endDate){ days.push(new Date(cursor)); cursor.setDate(cursor.getDate()+1); }
  const dow=['일','월','화','수','목','금','토'];

  let html = `<div class="section-h"><div class="h">캘린더</div><button class="icon-btn" onclick="openShareCalendarCard()">📤 이미지</button></div>`;
  html += `<div class="cal-summary">
    <div class="box"><div class="v">${completedThisMonth.length}권</div><div class="l">이번 달 완독</div></div>
    <div class="box"><div class="v">${monthPages.toLocaleString()}p</div><div class="l">이번 달 읽은 페이지</div></div>
  </div>`;
  html += `<div class="cal-head"><button class="cal-nav" onclick="changeMonth(-1)">←</button><div class="m">${year}년 ${month+1}월</div><button class="cal-nav" onclick="changeMonth(1)">→</button></div>`;
  html += `<div class="cal-grid">`;
  dow.forEach(d=> html += `<div class="cal-dow">${d}</div>`);
  days.forEach(day=>{
    const dateStr=toLocalDateStr(day); const dayBooks=byDate[dateStr]||[]; const isOther=day.getMonth()!==month;

    if(dayBooks.length===0){
      html += `<div class="cal-cell ${isOther?'other':''}" style="cursor:pointer" onclick="addBookForDate('${dateStr}')"><span class="d">${day.getDate()}</span></div>`;
    }else if(dayBooks.length===1){
      const b = dayBooks[0];
      html += `<div class="cal-cell has ${isOther?'other':''}" style="background:${b.color||'#5b5bd6'}" onclick="openEditModal(${b.id})" title="${escapeHtml(b.title)}">
        ${b.cover?`<img class="cover-img" src="${b.cover}" loading="lazy"/><div class="cover-shade"></div>`:''}
        <span class="d">${day.getDate()}</span>
      </div>`;
    }else{
      const shown = dayBooks.slice(0,2);
      html += `<div class="cal-cell has multi ${isOther?'other':''}">
        ${shown.map(b=>`<div class="mini-cover" style="background:${b.color||'#5b5bd6'}" onclick="event.stopPropagation();openEditModal(${b.id})">
          ${b.cover?`<img src="${b.cover}" loading="lazy"/>`:''}
        </div>`).join('')}
        <span class="d">${day.getDate()}</span>
        <span class="cal-more">${dayBooks.length}</span>
      </div>`;
    }
  });
  html += `</div>`;

  html += `<div class="month-list"><div class="h" style="margin-bottom:10px;font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:var(--text-muted);font-weight:700">이번 달의 완독</div>`;
  if(completedThisMonth.length===0){ html += `<div class="month-empty">이 달에 완독한 책이 없어요</div>`; }
  else{
    [...completedThisMonth].sort((a,b)=>new Date(a.completedDate)-new Date(b.completedDate)).forEach(book=>{
      html += `<div class="month-row" onclick="openEditModal(${book.id})">
        ${book.cover?`<img class="cov" src="${book.cover}" loading="lazy"/>`:`<div class="chip" style="background:${book.color}"></div>`}
        <div style="flex:1;min-width:0">
          <div class="bt">${book.title}</div>
          <div class="bd">${book.completedDate}${book.author?` · ${escapeHtml(cleanAuthor(book.author))}`:''}${book.pages?` · ${book.pages}p`:''}</div>
          ${book.rating?`<div class="stars">${starHtml(book.rating)}</div>`:''}
        </div>
      </div>`;
    });
  }
  html += `</div>`;
  document.getElementById('calendarView').innerHTML = html;
}

function avgReadDays(list){
  const withDates = list.filter(b=>b.startDate && b.completedDate);
  if(withDates.length===0) return null;
  const total = withDates.reduce((s,b)=>{
    const d1=new Date(b.startDate), d2=new Date(b.completedDate);
    const diff = Math.round((d2-d1)/86400000);
    return s + Math.max(diff,0);
  },0);
  return (total/withDates.length).toFixed(1);
}

// 4번째 통계 칸에서 순환 선택 가능한 지표들
const EXTRA_STAT_OPTIONS = [
  {id:'avgDays', label:'평균 완독 소요일'},
  {id:'perMonth', label:'월 평균 완독 권수'},
  {id:'avgPages', label:'평균 페이지 수'},
  {id:'thickest', label:'가장 두꺼운 책'},
  {id:'topMonth', label:'가장 많이 읽은 달'},
  {id:'fiveStar', label:'5점 준 책'},
  {id:'topAuthor', label:'가장 많이 읽은 작가'}
];
let extraStatId = localStorage.getItem('stats-extra-metric') || 'avgDays';
function cycleExtraStat(){
  const ids = EXTRA_STAT_OPTIONS.map(o=>o.id);
  const idx = ids.indexOf(extraStatId);
  extraStatId = ids[(idx+1)%ids.length];
  localStorage.setItem('stats-extra-metric', extraStatId);
  renderStats();
}
function computeExtraStat(id, list){
  switch(id){
    case 'avgDays': { const d=avgReadDays(list); return d? d+'일' : '-'; }
    case 'perMonth': {
      if(list.length===0) return '-';
      const months = new Set(list.map(b=>(b.completedDate||'').slice(0,7)).filter(Boolean));
      return (list.length/(months.size||1)).toFixed(1)+'권';
    }
    case 'avgPages': {
      if(list.length===0) return '-';
      return Math.round(list.reduce((s,b)=>s+(b.pages||0),0)/list.length)+'p';
    }
    case 'thickest': {
      const longest = list.reduce((a,b)=> (b.pages||0)>(a?a.pages:0)?b:a, null);
      return longest? longest.pages+'p' : '-';
    }
    case 'topMonth': {
      const counts = {};
      list.forEach(b=>{ if(!b.completedDate) return; const m=new Date(b.completedDate).getMonth()+1; counts[m]=(counts[m]||0)+1; });
      const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
      return entries.length? `${entries[0][0]}월 ${entries[0][1]}권` : '-';
    }
    case 'fiveStar': { return list.filter(b=>b.rating===5).length+'권'; }
    case 'topAuthor': {
      const counts = {};
      list.forEach(b=>{ const a=cleanAuthor(b.author); if(a) counts[a]=(counts[a]||0)+1; });
      const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
      return entries.length ? entries[0][0] : '-';
    }
    default: return '-';
  }
}
function cleanAuthor(name){
  return String(name||'').replace(/\s*\([^)]*\)/g, '').split(',')[0].trim();
}

function renderStats(){
  const completed = books.filter(b=>b.status==='completed' && b.completedDate);
  if(completed.length===0){
    document.getElementById('statsView').innerHTML = `<div class="stat-empty">아직 완독한 책이 없어요.<br/>책을 기록하면 통계가 보여요.</div>`;
    return;
  }
  const availableYears = getAvailableYears(completed);
  if(statsYear!=='all' && !availableYears.map(String).includes(statsYear)){
    statsYear = availableYears.length ? String(availableYears[0]) : 'all';
  }
  const scoped = statsYear==='all' ? completed : completed.filter(b=> new Date(b.completedDate).getFullYear()===Number(statsYear));

  const totalPages = scoped.reduce((s,b)=>s+b.pages,0);
  const rated = scoped.filter(b=>b.rating>0);
  const avgRating = rated.length ? (rated.reduce((s,b)=>s+b.rating,0)/rated.length).toFixed(1) : '-';
  const extraOpt = EXTRA_STAT_OPTIONS.find(o=>o.id===extraStatId) || EXTRA_STAT_OPTIONS[0];
  const extraValue = computeExtraStat(extraStatId, scoped);

  let html = `<div class="period-row">
    <select class="period-select" onchange="onStatsYearChange(this.value)">
      <option value="all" ${statsYear==='all'?'selected':''}>전체 기간</option>
      ${availableYears.map(y=>`<option value="${y}" ${statsYear===String(y)?'selected':''}>${y}년</option>`).join('')}
    </select>
  </div>`;

  html += `<div class="stat-grid">
    <div class="stat-box"><div class="v">${scoped.length}권</div><div class="l">${statsYear==='all'?'전체':statsYear+'년'} 완독</div></div>
    <div class="stat-box"><div class="v">${totalPages.toLocaleString()}p</div><div class="l">${statsYear==='all'?'전체':statsYear+'년'} 페이지</div></div>
    <div class="stat-box"><div class="v">${avgRating}${avgRating!=='-'?' ★':''}</div><div class="l">평균 별점</div></div>
    <div class="stat-box stat-box-editable" onclick="cycleExtraStat()"><div class="v">${extraValue}</div><div class="l">${extraOpt.label} <span class="edit-pencil">✎</span></div></div>
  </div>`;

  if(statsYear==='all'){
    // 연도별 막대 (권수) - 막대 위에 평균 별점도 같이 표시
    const yearCounts = {}, yearRatings = {};
    completed.forEach(b=>{
      const y=new Date(b.completedDate).getFullYear();
      yearCounts[y]=(yearCounts[y]||0)+1;
      if(b.rating>0){ (yearRatings[y]=yearRatings[y]||[]).push(b.rating); }
    });
    const years = Object.keys(yearCounts).map(Number).sort((a,b)=>a-b);
    const maxY = Math.max(...years.map(y=>yearCounts[y]), 1);
    html += `<div class="section-h"><div class="h">연도별 완독 (권수)</div></div><div class="bar-chart">`;
    years.forEach(y=>{
      const pct = Math.max((yearCounts[y]/maxY)*100, 8);
      const ratings = yearRatings[y]||[];
      const avg = ratings.length ? (ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1) : null;
      html += `<div class="bar-wrap">
        <div class="bar-rating">${avg?`⭐${avg}`:''}</div>
        <div class="bn" style="margin:0 0 4px">${yearCounts[y]}</div>
        <div class="bar" style="height:${pct}%" title="${y}년 ${yearCounts[y]}권"></div>
        <div class="bn">${String(y).slice(2)}년</div>
      </div>`;
    });
    html += `</div>`;
  }else{
    // 선택한 연도의 월별 막대 (권수) - 막대 위에 평균 별점도 같이 표시
    const monthCounts = Array(12).fill(0);
    const monthRatings = Array.from({length:12}, ()=>[]);
    scoped.forEach(b=>{
      const m = new Date(b.completedDate).getMonth();
      monthCounts[m]++;
      if(b.rating>0) monthRatings[m].push(b.rating);
    });
    const maxMonth = Math.max(...monthCounts, 1);
    html += `<div class="section-h"><div class="h">${statsYear}년 월별 완독 (권수)</div></div><div class="bar-chart">`;
    monthCounts.forEach((c,i)=>{
      const pct = Math.max((c/maxMonth)*100, c>0?8:0);
      const ratings = monthRatings[i];
      const avg = ratings.length ? (ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1) : null;
      html += `<div class="bar-wrap">
        <div class="bar-rating">${avg?`⭐${avg}`:''}</div>
        <div class="bn" style="margin:0 0 4px">${c||''}</div>
        <div class="bar" style="height:${pct}%" title="${i+1}월 ${c}권"></div>
        <div class="bn">${i+1}</div>
      </div>`;
    });
    html += `</div>`;
  }

  const tagCounts = {};
  scoped.forEach(b=> (b.tags||[]).forEach(t=> tagCounts[t]=(tagCounts[t]||0)+1));
  const topTags = Object.entries(tagCounts).sort((a,b)=>b[1]-a[1]).slice(0,6);
  if(topTags.length>0){
    html += `<div class="card-divider"></div><div class="section-h"><div class="h">많이 읽은 태그</div></div><div class="taglist">`;
    topTags.forEach(([t,c])=>{ html += `<div class="tagrow"><span class="name">#${t}</span><span class="cnt">${c}권</span></div>`; });
    html += `</div>`;
  }

  document.getElementById('statsView').innerHTML = html;
  fitStatBoxText();
}

    el.style.fontSize = size+'px';
    while(el.scrollWidth > el.clientWidth && size > 12){
      size -= 1;
      el.style.fontSize = size+'px';
    }

/* ---------------- 이미지 카드 생성 (공유) ---------------- */
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

let currentShareBlob = null;

async function openShareStackCard(){
  document.getElementById('calShareOptions').classList.add('hidden');
  const allCompleted = books.filter(b=>b.status==='completed');
  if(allCompleted.length===0){ alert('완독한 책이 있어야 이미지를 만들 수 있어요.'); return; }
  const completed = allCompleted.filter(inPeriod); // 책장 탭에서 선택한 기간을 그대로 반영
  if(completed.length===0){ alert('선택한 기간에 완독한 책이 없어요.'); return; }
  const periodText = periodYear==='all' ? '전체 기간' : (periodMonth==='all' ? `${periodYear}년` : `${periodYear}년 ${periodMonth}월`);
  const sorted = [...completed].sort((a,b)=> new Date(a.completedDate)-new Date(b.completedDate));
  const totalPages = completed.reduce((s,b)=>s+b.pages,0);
  const hLabel = heightLabel(totalPages, completed.length);
  const hObjLabel = heightObjectLabel(totalPages, completed.length);

  // 표지 이미지를 서버 프록시로 미리 로드 (캔버스에 안전하게 그리기 위함)
  document.getElementById('shareModal').classList.remove('hidden');
  lockBodyScroll();
  const loadingCanvas = document.getElementById('shareCanvas');
  loadingCanvas.width=800; loadingCanvas.height=200;
  const lctx = loadingCanvas.getContext('2d');
  lctx.fillStyle='#fafafa'; lctx.fillRect(0,0,800,200);
  lctx.fillStyle='#8a8a92'; lctx.font='500 16px Inter, sans-serif'; lctx.textAlign='center';
  lctx.fillText('이미지를 준비하는 중...', 400, 100); lctx.textAlign='left';

  const useCover = getStackStyle()==='cover';
  const uniqueCovers = useCover ? [...new Set(sorted.map(b=>b.cover).filter(Boolean))] : [];
  const uniqueSpineImgs = useCover ? [...new Set(sorted.map(b=>b.spineImage).filter(Boolean))] : [];
  const loadedPairs = await Promise.all([...uniqueCovers, ...uniqueSpineImgs].map(async url => [url, await loadImage(proxied(url))]));
  const imageMap = new Map(loadedPairs);

  const W = 800, padX=56;
  const SCALE = W/420; // 폰 화면 대비 캔버스가 넓은 만큼 두께도 비례해서 키움 (화면과 동일한 비율 유지)
  const gap=5;
  const stackH = sorted.reduce((s,b)=> s + spineHeightPx(b)*SCALE + gap, 0);
  const H = 340 + stackH + 50;

  const canvas = document.getElementById('shareCanvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  // 배경
  ctx.fillStyle = '#fafafa'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#5b5bd6'; ctx.font='700 18px Inter, sans-serif';
  ctx.fillText(periodText, padX, 44);
  ctx.fillStyle = '#18181b';
  ctx.font = '800 44px Inter, sans-serif';
  ctx.fillText(`${completed.length}권`, padX, 100);
  ctx.fillStyle = '#8a8a92'; ctx.font='500 20px Inter, sans-serif';
  ctx.fillText(`읽은 책 · 총 ${totalPages.toLocaleString()}페이지`, padX, 136);
  if(hLabel){
    ctx.fillStyle = '#5b5bd6'; ctx.font='700 20px Inter, sans-serif';
    ctx.fillText(`📏 다 쌓으면 약 ${hLabel}`, padX, 170);
  }
  if(hObjLabel){
    ctx.fillStyle = '#8a8a92'; ctx.font='500 17px Inter, sans-serif';
    ctx.fillText(hObjLabel, padX, 200);
  }

  let y = 250;
  const maxW = W - padX*2;
  [...sorted].reverse().forEach(book=>{
    const rowH = spineHeightPx(book) * SCALE;
    const spineImg = (useCover && book.spineImage) ? imageMap.get(book.spineImage) : null;
    const img = spineImg ? null : ((useCover && book.cover) ? imageMap.get(book.cover) : null);
    // 실제 책등 이미지가 있으면 페이지수 기반 임의 폭 대신 이미지의 실제 비율에 맞춘 폭을 씀
    // (두꺼운/얇은 책마다 폭이 다르게 나오는 게 실제 책장처럼 자연스러움 - 잘리지도 여백도 안 남음)
    const w = spineImg
      ? Math.min(rowH * (spineImg.height/spineImg.width), maxW*0.95)
      : maxW * (widthFor(book)/100);
    const off = offsetFor(book)/100;
    const x = padX + (maxW-w)/2 + maxW*off*0.5;

    roundRect(ctx, x, y, w, rowH, 6);
    if(spineImg){
      ctx.save(); ctx.clip();
      ctx.fillStyle = book.color; ctx.fill(); // 이미지 비율이 안 맞아 여백이 생겨도 책 색으로 채워짐
      // 실제 책등 이미지는 세로로 긴 사진이라 반시계 방향으로 90도 돌려서 가로 막대에 맞춤
      // 절대 크롭하지 않음(항상 Math.min) - 폭이 상한에 걸려도 크롭 대신 여백을 감수함
      ctx.translate(x + w/2, y + rowH/2);
      ctx.rotate(-Math.PI/2);
      const scale = Math.min(rowH/spineImg.width, w/spineImg.height);
      const iw=spineImg.width*scale, ih=spineImg.height*scale;
      ctx.drawImage(spineImg, -iw/2, -ih/2, iw, ih);
      ctx.restore();
    }else if(img){
      ctx.save(); ctx.clip();
      // 표지 이미지에서 가운데 부분을 크롭해서 채움 (object-fit: cover)
      const scale = Math.max(w/img.width, rowH/img.height);
      const iw=img.width*scale, ih=img.height*scale;
      ctx.drawImage(img, x+(w-iw)/2, y+(rowH-ih)/2, iw, ih);
      // 텍스트 가독성을 위한 어두운 그라데이션
      const grad = ctx.createLinearGradient(x,y,x,y+rowH);
      grad.addColorStop(0,'rgba(0,0,0,0.05)'); grad.addColorStop(1,'rgba(0,0,0,0.6)');
      ctx.fillStyle=grad; ctx.fillRect(x,y,w,rowH);
      ctx.restore();
    }else{
      ctx.fillStyle = book.color; ctx.fill();
    }

    if(!spineImg && rowH >= 24){
      ctx.fillStyle = 'rgba(255,255,255,0.97)';
      ctx.font = '700 19px Inter, sans-serif';
      let title = book.title;
      while(ctx.measureText(title).width > w-130 && title.length>3){ title = title.slice(0,-2); }
      if(title !== book.title) title += '…';
      ctx.fillText(title, x+20, y+rowH/2+6);
      ctx.textAlign='right'; ctx.font='700 16px Inter, sans-serif';
      ctx.fillText(`${book.pages}p`, x+w-16, y+rowH/2+6);
      ctx.textAlign='left';
    }
    y += rowH+gap;
  });

  document.getElementById('shareModal').classList.remove('hidden');
  canvas.toBlob(blob=> currentShareBlob = blob, 'image/png');
}

function proxied(url){ return url ? `/api/image-proxy?url=${encodeURIComponent(url)}` : url; }
function loadImage(url){
  return new Promise((resolve)=>{
    if(!url){ resolve(null); return; }
    const img = new Image();
    img.onload = ()=> resolve(img);
    img.onerror = ()=> resolve(null);
    img.src = url;
  });
}

async function generateCalShareImage(){
  const year=currentMonth.getFullYear(), month=currentMonth.getMonth();
  const firstDay=new Date(year,month,1), lastDay=new Date(year,month+1,0);
  const monthStartStr = toLocalDateStr(firstDay), monthEndStr = toLocalDateStr(lastDay);

  const completedThisMonth = books.filter(b=>{ if(b.status!=='completed'||!b.completedDate) return false; const d=new Date(b.completedDate); return d.getFullYear()===year&&d.getMonth()===month; });
  const monthPages = completedThisMonth.reduce((s,b)=>s+(b.pages||0),0);

  // 범위에 따라 달력 그리드에 표시할 날짜별 책 계산
  const byDate = {};
  if(calShareScope==='completed'){
    completedThisMonth.forEach(b=> (byDate[b.completedDate]=byDate[b.completedDate]||[]).push(b));
  }else{
    books.filter(b=> b.status==='completed' || b.status==='reading').forEach(b=>{
      const range = getBookRange(b);
      if(!range) return;
      if(range.end < monthStartStr || range.start > monthEndStr) return;
      let cursor = parseLocalDate(range.start < monthStartStr ? monthStartStr : range.start);
      const rangeEnd = parseLocalDate(range.end > monthEndStr ? monthEndStr : range.end);
      while(cursor <= rangeEnd){
        const ds = toLocalDateStr(cursor);
        (byDate[ds] = byDate[ds]||[]).push(b);
        cursor.setDate(cursor.getDate()+1);
      }
    });
  }

  const startDate=new Date(firstDay); startDate.setDate(startDate.getDate()-firstDay.getDay());
  const endDate=new Date(lastDay); endDate.setDate(endDate.getDate()+(6-lastDay.getDay()));
  const days=[]; const cursor=new Date(startDate);
  while(cursor<=endDate){ days.push(new Date(cursor)); cursor.setDate(cursor.getDate()+1); }
  const weeks = Math.ceil(days.length/7);

  // 표지 이미지를 서버 프록시를 통해 미리 로드 (CORS 문제 없이 캔버스에 그리기 위함)
  const gridCovers = Object.values(byDate).flat().map(b=>b.cover).filter(Boolean);
  const listCovers = calShareFull ? completedThisMonth.map(b=>b.cover).filter(Boolean) : [];
  const uniqueCovers = [...new Set([...gridCovers, ...listCovers])];
  const canvasLoading = document.getElementById('shareCanvas');
  canvasLoading.width=800; canvasLoading.height=200;
  const lctx = canvasLoading.getContext('2d');
  lctx.fillStyle='#fafafa'; lctx.fillRect(0,0,800,200);
  lctx.fillStyle='#8a8a92'; lctx.font='500 16px Inter, sans-serif'; lctx.textAlign='center';
  lctx.fillText('이미지를 준비하는 중...', 400, 100); lctx.textAlign='left';

  const loadedPairs = await Promise.all(uniqueCovers.map(async url => [url, await loadImage(proxied(url))]));
  const imageMap = new Map(loadedPairs);

  const W = 800, padX = 50;
  const dowY = 210, gridTop = 260;
  const colW = (W - padX*2) / 7;
  const bookW = colW * 0.74, bookH = bookW * 1.42;
  const emptyRowH = 70, bookRowH = bookH + 30;

  // 행별 높이 계산 (책이 있는 주는 표지 높이만큼, 없으면 숫자만 들어갈 낮은 높이)
  const rows = [];
  for(let w=0; w<weeks; w++){
    const rowDays = days.slice(w*7, w*7+7);
    const hasBook = rowDays.some(d => (byDate[toLocalDateStr(d)]||[]).length>0);
    rows.push({ days: rowDays, height: hasBook ? bookRowH : emptyRowH });
  }
  const gridH = rows.reduce((s,r)=>s+r.height, 0);

  // "전체" 옵션이면 목록 영역 높이도 미리 계산
  const listRowH = 78;
  const listTitleH = calShareFull ? 56 : 0;
  const listH = calShareFull ? completedThisMonth.length * listRowH + listTitleH + 20 : 0;
  const H = gridTop + gridH + 36 + listH;

  const canvas = document.getElementById('shareCanvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,W,H);

  // 큰 날짜 타이틀 "YYYY.MM."
  ctx.fillStyle = '#18181b'; ctx.font = '800 52px Inter, sans-serif';
  ctx.fillText(`${year}.${String(month+1).padStart(2,'0')}.`, padX, 88);
  ctx.fillStyle = '#8a8a92'; ctx.font = '600 17px Inter, sans-serif';
  ctx.fillText(`이번 달 완독 ${completedThisMonth.length}권 · ${monthPages.toLocaleString()}페이지${calShareScope==='all'?' · 읽은 기록 전체 표시':''}`, padX, 122);

  const dow = ['일','월','화','수','목','금','토'];
  ctx.font = '700 18px Inter, sans-serif'; ctx.fillStyle = '#a8a8b0'; ctx.textAlign = 'center';
  dow.forEach((d,i)=> ctx.fillText(d, padX + i*colW + colW/2, dowY));

  let y = gridTop;
  rows.forEach(row=>{
    row.days.forEach((day,col)=>{
      const centerX = padX + col*colW + colW/2;
      const dateStr = toLocalDateStr(day);
      const dayBooks = (byDate[dateStr]||[]).slice(0,2); // 최대 2권까지 표시
      const isOther = day.getMonth()!==month;

      if(dayBooks.length===0){
        // 책 없는 날: 숫자만 표시
        ctx.fillStyle = isOther ? '#e4e4e8' : '#c4c4cc';
        ctx.font = '700 23px Inter, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(String(day.getDate()), centerX, y + emptyRowH/2 + 8);
        return;
      }

      // 책 있는 날: 세로형 표지 이미지 (겹치지 않게 나란히)
      const n = dayBooks.length;
      const w = n===1 ? bookW : bookW*0.62;
      const h = w*1.42;
      const gap = 5;
      const groupW = w*n + gap*(n-1);
      let bx = centerX - groupW/2;
      const by = y + (row.height-30-h)/2 + 6;

      dayBooks.forEach(book=>{
        const img = book.cover ? imageMap.get(book.cover) : null;
        roundRect(ctx, bx, by, w, h, 8);
        ctx.save(); ctx.clip();
        if(img){
          const scale = Math.max(w/img.width, h/img.height);
          const iw=img.width*scale, ih=img.height*scale;
          ctx.drawImage(img, bx+(w-iw)/2, by+(h-ih)/2, iw, ih);
        }else{
          ctx.fillStyle = book.color; ctx.fillRect(bx,by,w,h);
        }
        ctx.restore();
        ctx.strokeStyle='rgba(0,0,0,0.06)'; ctx.lineWidth=1;
        roundRect(ctx, bx, by, w, h, 8); ctx.stroke();
        bx += w+gap;
      });

      // 날짜 숫자 - 표지 그룹 아래에 작게
      ctx.fillStyle = '#9a9aa4'; ctx.font='700 15px Inter, sans-serif'; ctx.textAlign='center';
      ctx.fillText(String(day.getDate()), centerX, by+h+21);
    });
    y += row.height;
  });
  ctx.textAlign = 'left';

  // "달력 + 목록 전체" 옵션이면 아래에 이번 달 완독 목록을 이어서 그림
  if(calShareFull){
    y += 16;
    ctx.strokeStyle = '#ececec'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(padX, y); ctx.lineTo(W-padX, y); ctx.stroke();
    y += 34;
    ctx.fillStyle = '#8a8a92'; ctx.font = '700 13px Inter, sans-serif';
    ctx.fillText('이번 달의 완독', padX, y);
    y += 22;

    const sortedList = [...completedThisMonth].sort((a,b)=> new Date(a.completedDate)-new Date(b.completedDate));
    sortedList.forEach(book=>{
      const coverW = 40, coverH = 57;
      const img = book.cover ? imageMap.get(book.cover) : null;
      roundRect(ctx, padX, y, coverW, coverH, 5);
      ctx.save(); ctx.clip();
      if(img){
        const scale = Math.max(coverW/img.width, coverH/img.height);
        const iw=img.width*scale, ih=img.height*scale;
        ctx.drawImage(img, padX+(coverW-iw)/2, y+(coverH-ih)/2, iw, ih);
      }else{
        ctx.fillStyle = book.color; ctx.fillRect(padX,y,coverW,coverH);
      }
      ctx.restore();

      const textX = padX + coverW + 16;
      ctx.fillStyle = '#18181b'; ctx.font = '700 16px Inter, sans-serif';
      let title = book.title;
      while(ctx.measureText(title).width > W-padX-textX-16 && title.length>3){ title = title.slice(0,-2); }
      if(title!==book.title) title += '…';
      ctx.fillText(title, textX, y+22);

      ctx.fillStyle = '#9a9aa4'; ctx.font = '500 13px Inter, sans-serif';
      const meta = [book.completedDate, cleanAuthor(book.author), book.pages?`${book.pages}p`:null].filter(Boolean).join(' · ');
      ctx.fillText(meta, textX, y+42);

      if(book.rating){
        ctx.fillStyle = '#f0ac1f'; ctx.font = '700 13px Inter, sans-serif';
        ctx.fillText(`★ ${book.rating}`, textX, y+60);
      }
      y += listRowH;
    });
  }

  document.getElementById('shareModal').classList.remove('hidden');
  canvas.toBlob(blob=> currentShareBlob = blob, 'image/png');
}

function closeShareModal(){ document.getElementById('shareModal').classList.add('hidden'); currentShareBlob=null; unlockBodyScroll(); }

function downloadShareImage(){
  const canvas = document.getElementById('shareCanvas');
  const url = canvas.toDataURL('image/png');
  const a = document.createElement('a');
  a.href = url; a.download = `독서기록-${toLocalDateStr(new Date())}.png`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

async function shareImage(){
  if(!currentShareBlob){
    const canvas = document.getElementById('shareCanvas');
    currentShareBlob = await new Promise(r=> canvas.toBlob(r,'image/png'));
  }
  const file = new File([currentShareBlob], 'reading.png', {type:'image/png'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:'독서기록'}); }catch(e){ /* 취소됨 */ }
  }else{
    downloadShareImage();
  }
}

let firebaseInitAttempts = 0;
function initFirebase(){
  if(typeof firebase === 'undefined'){
    firebaseInitAttempts++;
    if(firebaseInitAttempts <= 10){
      // SDK 스크립트가 아직 로딩 중일 수 있으니 잠시 후 재시도
      setTimeout(initFirebase, 400);
    }else{
      console.error('Firebase SDK 로딩 실패 - 네트워크 또는 콘텐츠 차단 확장 프로그램을 확인해주세요.');
      const el = document.getElementById('syncArea');
      if(el) el.innerHTML = `<div class="sync-card"><div style="font-size:12px;color:var(--danger);line-height:1.6">클라우드 기능을 불러오지 못했어요.<br/>네트워크 상태를 확인하거나, 사파리의 콘텐츠 차단 확장 프로그램을 잠시 꺼보고 새로고침해주세요.</div></div>`;
    }
    return;
  }
  try{
    fbApp = firebase.initializeApp(FIREBASE_CONFIG);
    fbAuth = firebase.auth();
    fbDb = firebase.firestore();
    fbAuth.getRedirectResult().catch(err=>{
      console.error('redirect result error', err);
      if(err && err.code) alert('로그인 처리 중 오류: ' + err.code);
    });
    fbAuth.onAuthStateChanged(async user=>{
      currentUser = user;
      renderSyncArea();
      if(booksListenerUnsub){ booksListenerUnsub(); booksListenerUnsub=null; }
      if(user){
        await migrateBooksIfNeeded();
        await pullMetaFromCloud();
        attachBooksListener();
      }
    });
  }catch(e){
    console.error('Firebase 초기화 실패', e);
  }
}

function signInGoogle(){
  if(!fbAuth){ alert('클라우드 기능을 아직 불러오는 중이거나 실패했어요. 잠시 후 다시 시도하거나 새로고침해주세요.'); return; }
  const provider = new firebase.auth.GoogleAuthProvider();
  fbAuth.signInWithPopup(provider).catch(err=>{
    if(err.code === 'auth/popup-blocked' || err.code === 'auth/cancelled-popup-request'){
      // 팝업이 막혔으면 리다이렉트 방식으로 대체 시도
      fbAuth.signInWithRedirect(provider).catch(err2=>{
        alert('로그인 중 오류가 발생했어요:\n' + err2.code + '\n' + err2.message);
        console.error(err2);
      });
      return;
    }
    if(err.code === 'auth/popup-closed-by-user') return; // 사용자가 직접 닫은 경우는 조용히 무시
    alert('로그인 중 오류가 발생했어요:\n' + err.code + '\n' + err.message);
    console.error(err);
  });
}
function signOutGoogle(){
  if(booksListenerUnsub){ booksListenerUnsub(); booksListenerUnsub=null; }
  if(fbAuth) fbAuth.signOut();
}

function booksCollection(){ return fbDb.collection('users').doc(currentUser.uid).collection('books'); }
function normalizeBook(b){ return { status:'completed', tags:[], startDate:null, ...b, tags:b.tags||[] }; }

// 예전(책 전체를 통짜 배열로 저장하던) 방식 데이터가 있으면, 책 하나당 문서 하나씩으로 1회 옮겨줌
async function migrateBooksIfNeeded(){
  if(!currentUser || !fbDb) return;
  try{
    const oldDoc = await fbDb.collection('users').doc(currentUser.uid).get();
    if(!oldDoc.exists) return;
    const data = oldDoc.data();
    if(!Array.isArray(data.books) || data.books.length===0) return;
    const already = await booksCollection().limit(1).get();
    if(!already.empty) return; // 이미 새 방식으로 옮겨져 있으면 재실행 안 함
    const batch = fbDb.batch();
    data.books.forEach(b=>{ batch.set(booksCollection().doc(String(b.id)), b); });
    await batch.commit();
    await fbDb.collection('users').doc(currentUser.uid).set({ books: firebase.firestore.FieldValue.delete() }, {merge:true});
  }catch(e){
    console.error('책 데이터 이전 실패', e);
  }
}

// 책 목록은 실시간 구독 - 다른 기기에서 바뀌면 새로고침 없이도 바로 반영되고,
// 책 한 권 수정이 다른 책들에 절대 영향을 못 주는 구조라 유령 중복이 생길 수가 없음
function attachBooksListener(){
  if(!currentUser || !fbDb) return;
  booksListenerUnsub = booksCollection().onSnapshot(snap=>{
    const cloudBooks = [];
    snap.forEach(doc=> cloudBooks.push(normalizeBook(doc.data())));
    books = cloudBooks;
    saveBooksRaw();
    render();
    localStorage.setItem('last-sync', new Date().toISOString());
    renderSyncArea();
  }, err=>{
    console.error('책 목록 실시간 동기화 실패', err);
  });
}

async function saveBookToCloud(book){
  if(!currentUser || !fbDb || !book) return;
  syncing = true; renderSyncArea();
  try{ await booksCollection().doc(String(book.id)).set(book); }
  catch(e){ console.error('책 저장(클라우드) 실패', e); }
  finally{ syncing = false; renderSyncArea(); }
}
async function deleteBookFromCloud(id){
  if(!currentUser || !fbDb) return;
  try{ await booksCollection().doc(String(id)).delete(); }
  catch(e){ console.error('책 삭제(클라우드) 실패', e); }
}

// 제목/부제목/위시폴더 등 자잘한 설정값은 그대로 문서 하나에 저장 (변경이 드물어서 안전함)
async function pushMetaToCloud(){
  if(!currentUser || !fbDb) return;
  try{
    await fbDb.collection('users').doc(currentUser.uid).set({
      wishFolders,
      appTitle: localStorage.getItem('app-title') || null,
      appSubtitle: localStorage.getItem('app-subtitle') || null,
      updatedAt: Date.now()
    }, {merge:true});
  }catch(e){ console.error('설정 저장 실패', e); }
}
async function pullMetaFromCloud(){
  if(!currentUser || !fbDb) return;
  try{
    const snap = await fbDb.collection('users').doc(currentUser.uid).get();
    if(!snap.exists) return;
    const data = snap.data();
    if(Array.isArray(data.wishFolders)){
      const cloudFolderIds = new Set(data.wishFolders.map(f=>f.id));
      const localOnlyFolders = wishFolders.filter(f=>!cloudFolderIds.has(f.id));
      wishFolders = [...data.wishFolders, ...localOnlyFolders];
      localStorage.setItem('wish-folders', JSON.stringify(wishFolders));
    }
    if(data.appTitle) localStorage.setItem('app-title', data.appTitle);
    if(data.appSubtitle) localStorage.setItem('app-subtitle', data.appSubtitle);
    applyTitleFromStorage();
  }catch(e){ console.error('설정 불러오기 실패', e); }
}

function renderSyncArea(){
  const el = document.getElementById('syncArea');
  if(!el) return;

  if(!currentUser){

      <div class="settings-row">
        <button class="btn-delete" style="margin-top:0" onclick="signOutGoogle()">로그아웃</button>
      </div>
    </div>`;
}

/* ---------------- 스와이프로 팝업 닫기 ---------------- */
function enableSwipeToClose(cardSelector, closeFn){
  const card = document.querySelector(cardSelector);
  const handle = card ? card.querySelector('.card-top') : null;
  if(!card || !handle) return;
  let startY=0, currentY=0, dragging=false;

  handle.addEventListener('touchstart', e=>{
    startY = e.touches[0].clientY; currentY = startY; dragging=true;
    card.style.transition='none';
  }, {passive:true});

  handle.addEventListener('touchmove', e=>{
    if(!dragging) return;
    currentY = e.touches[0].clientY;
    const delta = currentY - startY;
    if(delta>0) card.style.transform = `translateY(${delta}px)`;
  }, {passive:true});

  handle.addEventListener('touchend', ()=>{
    if(!dragging) return;
    dragging=false;
    const delta = currentY - startY;
    card.style.transition = 'transform .2s ease';
    if(delta > 90){
      card.style.transform = `translateY(100%)`;
      setTimeout(()=>{ closeFn(); card.style.transform=''; card.style.transition=''; }, 180);
    }else{
      card.style.transform = '';
    }
    startY=0; currentY=0;
  });
}
