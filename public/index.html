async function migrateBooksIfNeeded(){
  if(!currentUser || !fbDb) return;
  try{
    const oldDoc = await fbDb.collection('users').doc(currentUser.uid).get();
    if(!oldDoc.exists) return;
    const data = oldDoc.data();
    if(!Array.isArray(data.books) || data.books.length===0) return;
    const already = await booksCollection().limit(1).get();
    if(!already.empty) return; // 이미 새 방식으로 옮겨져 있으면 재실행 안 함
    const batch = fbDb.batch();
    data.books.forEach(b=>{ batch.set(booksCollection().doc(String(b.id)), b); });
    await batch.commit();
    await fbDb.collection('users').doc(currentUser.uid).set({ books: firebase.firestore.FieldValue.delete() }, {merge:true});
  }catch(e){
    console.error('책 데이터 이전 실패', e);
  }
}

// 책 목록은 실시간 구독 - 다른 기기에서 바뀌면 새로고침 없이도 바로 반영되고,
// 책 한 권 수정이 다른 책들에 절대 영향을 못 주는 구조라 유령 중복이 생길 수가 없음
function attachBooksListener(){
  if(!currentUser || !fbDb) return;
  booksListenerUnsub = booksCollection().onSnapshot(snap=>{
    const cloudBooks = [];
    snap.forEach(doc=> cloudBooks.push(normalizeBook(doc.data())));
    books = cloudBooks;
    saveBooksRaw();
    // 책등 이미지 일괄 조회처럼 책을 한 권씩 여러 번 연달아 저장할 때, 저장할 때마다
    // 이 구독이 매번 화면 전체를 다시 그려서 책이 하나씩 깜빡이며 새로고침되는 것처럼
    // 보였음 - 그런 일괄 작업 중에는(suppressCloudRender) 화면을 안 그리고 건너뜀
    if(!suppressCloudRender) render();
    localStorage.setItem('last-sync', new Date().toISOString());
    renderSyncArea();
  }, err=>{
    console.error('책 목록 실시간 동기화 실패', err);
  });
}

async function saveBookToCloud(book){
  if(!currentUser || !fbDb || !book) return;
  syncing = true; renderSyncArea();
  try{ await booksCollection().doc(String(book.id)).set(book); }
  catch(e){ console.error('책 저장(클라우드) 실패', e); }
  finally{ syncing = false; renderSyncArea(); }
}
async function deleteBookFromCloud(id){
  if(!currentUser || !fbDb) return;
  try{ await booksCollection().doc(String(id)).delete(); }
  catch(e){ console.error('책 삭제(클라우드) 실패', e); }
}

// 제목/부제목/위시폴더 등 자잘한 설정값은 그대로 문서 하나에 저장 (변경이 드물어서 안전함)
async function pushMetaToCloud(){
  if(!currentUser || !fbDb) return;
  try{
    await fbDb.collection('users').doc(currentUser.uid).set({
      wishFolders,
      appTitle: localStorage.getItem('app-title') || null,
      appSubtitle: localStorage.getItem('app-subtitle') || null,
      updatedAt: Date.now()
    }, {merge:true});
  }catch(e){ console.error('설정 저장 실패', e); }
}
async function pullMetaFromCloud(){
  if(!currentUser || !fbDb) return;
  try{
    const snap = await fbDb.collection('users').doc(currentUser.uid).get();
    if(!snap.exists) return;
    const data = snap.data();
    if(Array.isArray(data.wishFolders)){
      const cloudFolderIds = new Set(data.wishFolders.map(f=>f.id));
      const localOnlyFolders = wishFolders.filter(f=>!cloudFolderIds.has(f.id));
      wishFolders = [...data.wishFolders, ...localOnlyFolders];
      localStorage.setItem('wish-folders', JSON.stringify(wishFolders));
    }
    if(data.appTitle) localStorage.setItem('app-title', data.appTitle);
    if(data.appSubtitle) localStorage.setItem('app-subtitle', data.appSubtitle);
    applyTitleFromStorage();
  }catch(e){ console.error('설정 불러오기 실패', e); }
}

function renderSyncArea(){
  const el = document.getElementById('syncArea');
  if(!el) return;

  if(!currentUser){
    el.innerHTML = `
      <div class="sync-card">
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px;line-height:1.6">Google 계정으로 로그인하면 기기가 바뀌어도 독서 기록이 그대로 이어져요.</div>
        <button class="google-btn" onclick="signInGoogle()">Google로 로그인</button>
      </div>`;
    return;
  }

  const lastSync = localStorage.getItem('last-sync');
  const lastSyncLabel = lastSync ? new Date(lastSync).toLocaleString('ko-KR') : '아직 없음';
  el.innerHTML = `
    <div class="sync-card">
      <div class="row">
        ${currentUser.photoURL ? `<img class="avatar" src="${currentUser.photoURL}"/>` : `<div class="avatar"></div>`}
        <div>
          <div class="name">${currentUser.displayName||'사용자'}</div>
          <div class="email">${currentUser.email||''}</div>
        </div>
      </div>
      <div class="status">${syncing ? '동기화 중...' : `✓ 실시간 동기화 중 · 마지막: ${lastSyncLabel}`}</div>
      <div class="settings-row">
        <button class="btn-delete" style="margin-top:0" onclick="signOutGoogle()">로그아웃</button>
      </div>
    </div>`;
}

/* ---------------- 스와이프로 팝업 닫기 ---------------- */
function enableSwipeToClose(cardSelector, closeFn){
  const card = document.querySelector(cardSelector);
  const handle = card ? card.querySelector('.card-top') : null;
  if(!card || !handle) return;
  let startY=0, currentY=0, dragging=false;

  handle.addEventListener('touchstart', e=>{
    startY = e.touches[0].clientY; currentY = startY; dragging=true;
    card.style.transition='none';
  }, {passive:true});

  handle.addEventListener('touchmove', e=>{
    if(!dragging) return;
    currentY = e.touches[0].clientY;
    const delta = currentY - startY;
    if(delta>0) card.style.transform = `translateY(${delta}px)`;
  }, {passive:true});

  handle.addEventListener('touchend', ()=>{
    if(!dragging) return;
    dragging=false;
    const delta = currentY - startY;
    card.style.transition = 'transform .2s ease';
    if(delta > 90){
      card.style.transform = `translateY(100%)`;
      setTimeout(()=>{ closeFn(); card.style.transform=''; card.style.transition=''; }, 180);
    }else{
      card.style.transform = '';
    }
    startY=0; currentY=0;
  });
}

enableSwipeToClose('#addModal .card', closeAddModal);
enableSwipeToClose('#titleModal .card', closeTitleModal);
enableSwipeToClose('#bookInfoModal .card', closeBookInfoModal);
enableSwipeToClose('#shareModal .card', closeShareModal);

/* ---------------- 초기화 ---------------- */
function syncDateBounds(){
  const startEl = document.getElementById('startDateInput');
  const doneEl = document.getElementById('dateInput');
  // 완독 날짜는 시작 날짜보다 빠를 수 없음
  doneEl.min = startEl.value || '';
  // 시작 날짜는 완독 날짜보다 늦을 수 없음
  startEl.max = doneEl.value || '';
}

document.getElementById('dateInput').addEventListener('input', ()=>{ autoFillStartDate(); syncDateBounds(); });
document.getElementById('dateInput').addEventListener('change', ()=>{ autoFillStartDate(); syncDateBounds(); });
document.getElementById('startDateInput').addEventListener('input', ()=>{ startDateManuallyEdited = true; syncDateBounds(); });
document.getElementById('startDateInput').addEventListener('change', ()=>{ startDateManuallyEdited = true; syncDateBounds(); });

applyTheme();
applyTitleFromStorage();
render();
initFirebase();
if(getStackStyle()==='cover') backfillSpineImages().then(changed=>{ if(changed && currentView==='shelf') renderShelf(); });
</script>
