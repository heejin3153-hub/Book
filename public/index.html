<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>독서기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    color-scheme: light;
    --bg:#fafafa; --surface:#ffffff; --border:#ececec; --border-2:#e2e2e2;
    --text:#18181b; --text-muted:#8a8a92;
    --accent:#5b5bd6; --accent-soft:#eeeeff; --accent-dark:#4747b8;
    --danger:#e05252; --star:#f0ac1f; --green:#3fa88a;
    --radius:16px; --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Inter',-apple-system,'Malgun Gothic',sans-serif;
    min-height:100vh; min-height:100dvh; padding-bottom:calc(100px + var(--safe-b)); -webkit-font-smoothing:antialiased; touch-action:manipulation; }
  .wrap{ max-width:600px; margin:0 auto; padding:28px 16px 0; }

  .header-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .header-menu{ background:var(--surface); border:1px solid var(--border); color:var(--text-muted); width:34px; height:34px; border-radius:10px; font-size:17px; cursor:pointer; flex-shrink:0; line-height:1; }
  h1.title{ font-size:23px; margin:0 0 4px; font-weight:800; letter-spacing:-0.02em; }
  .subtitle{ color:var(--text-muted); font-size:13px; margin:0 0 22px; font-weight:500; }

  .tabs{ display:flex; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:4px; margin-bottom:18px; position:sticky; top:10px; z-index:10; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .tab{ flex:1 0 auto; min-width:64px; background:none; border:none; color:var(--text-muted); font-size:12.5px; font-weight:600; padding:10px 8px; cursor:pointer; border-radius:9px; white-space:nowrap; }
  .tab.active{ color:var(--text); background:var(--bg); }

  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:22px 16px; box-shadow:0 1px 2px rgba(0,0,0,0.02); }

  .stats{ text-align:center; margin-bottom:18px; }
  .stats .num{ font-size:38px; font-weight:800; line-height:1; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; }
  .stats .label{ color:var(--text-muted); font-size:12px; margin-top:8px; font-weight:600; }
  .stats .height{ display:inline-flex; align-items:center; gap:5px; margin-top:12px; padding:6px 12px; background:var(--accent-soft); color:var(--accent-dark); border-radius:20px; font-size:12px; font-weight:700; }

  .section-h{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .section-h .h{ font-size:11px; letter-spacing:0.03em; text-transform:uppercase; color:var(--text-muted); font-weight:700; }
  .icon-btn{ background:var(--bg); border:1px solid var(--border); color:var(--text-muted); border-radius:8px; padding:6px 10px; font-size:11px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:4px; }
  .icon-btn:active{ background:var(--accent-soft); color:var(--accent-dark); }

  /* 읽는 중 */
  .reading-list{ margin-bottom:22px; }
  .reading-card{ display:flex; gap:10px; align-items:center; background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:10px; margin-bottom:8px; }
  .reading-card .cov{ width:38px; height:54px; border-radius:5px; object-fit:cover; background:var(--border-2); flex-shrink:0; }
  .reading-card .covph{ width:38px; height:54px; border-radius:5px; flex-shrink:0; }
  .reading-card .rt{ font-size:13px; font-weight:700; cursor:pointer; }
  .reading-card .rd{ font-size:11px; color:var(--text-muted); margin-top:2px; }
  .reading-card .done-btn{ margin-left:auto; background:var(--green); color:#fff; border:none; border-radius:8px; padding:8px 12px; font-size:11.5px; font-weight:700; cursor:pointer; flex-shrink:0; }

  /* 태그 필터 */
  .tag-filters{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px; }
  .period-row{ display:flex; gap:8px; margin-bottom:16px; }
  .period-select{ background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:7px 10px; font-size:12px; font-weight:600; color:var(--text); font-family:'Inter',sans-serif; }
  .tag-chip{ background:var(--bg); border:1px solid var(--border); color:var(--text-muted); border-radius:20px; padding:6px 12px; font-size:11.5px; font-weight:600; cursor:pointer; }
  .tag-chip.on{ background:var(--accent); color:#fff; border-color:var(--accent); }

  /* 책 쌓기 */
  .shelf-area{ min-height:70px; }
  .stack{ display:flex; flex-direction:column-reverse; gap:4px; align-items:center; }
  .spine{ position:relative; display:flex; align-items:center; justify-content:center; border-radius:6px; cursor:pointer; box-shadow:0 2px 3px rgba(0,0,0,0.16), inset 0 1px 0 rgba(255,255,255,0.22); }
  .spine::after{ content:''; position:absolute; right:0; top:2px; bottom:2px; width:5px; background:repeating-linear-gradient(180deg,#efe8d8 0px,#efe8d8 1px,#e0d7c1 1px,#e0d7c1 2px); border-radius:0 4px 4px 0; }
  .spine-label{ display:flex; align-items:center; gap:8px; padding:0 14px 0 16px; width:100%; margin-right:5px; color:#fff; font-size:12.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-shadow:0 1px 2px rgba(0,0,0,0.15); }
  .spine-label .t{ overflow:hidden; text-overflow:ellipsis; }
  .spine-label .p{ margin-left:auto; font-size:11px; opacity:0.9; font-variant-numeric:tabular-nums; flex-shrink:0; }

  .empty-shelf{ text-align:center; color:var(--text-muted); font-size:13px; line-height:1.7; padding:40px 10px; border:1.5px dashed var(--border-2); border-radius:12px; font-weight:500; }

  .booklist{ margin-top:22px; padding-top:18px; border-top:1px solid var(--border); }
  .book-item{ border-bottom:1px solid var(--border); padding:11px 0; }
  .book-item:last-child{ border-bottom:none; }
  .book-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; cursor:pointer; }
  .book-row:last-child{ border-bottom:none; }
  .book-row .bt{ font-size:13.5px; font-weight:600; color:var(--text); }
  .book-row .bd{ font-size:11px; color:var(--text-muted); margin-top:2px; }
  .book-row .tags{ margin-top:4px; }
  .book-row .tags span{ font-size:10px; background:var(--accent-soft); color:var(--accent-dark); padding:2px 7px; border-radius:8px; margin-right:4px; font-weight:600; }
  .book-row .stars{ color:var(--star); font-size:11px; margin-top:3px; letter-spacing:1px; }
  .book-row .rv{ font-size:11px; color:var(--text-muted); margin-top:3px; font-style:italic; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:220px; }
  .book-row .bp{ font-size:13px; color:var(--accent); font-weight:700; font-variant-numeric:tabular-nums; flex-shrink:0; }

  /* 캘린더 */
  .cal-summary{ display:flex; gap:8px; margin-bottom:18px; }
  .cal-summary .box{ flex:1; background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:12px 10px; text-align:center; }
  .cal-summary .box .v{ font-size:20px; font-weight:800; letter-spacing:-0.01em; font-variant-numeric:tabular-nums; }
  .cal-summary .box .l{ font-size:10.5px; color:var(--text-muted); font-weight:600; margin-top:3px; }
  .cal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .cal-head .m{ font-size:16px; font-weight:700; letter-spacing:-0.01em; }
  .cal-nav{ background:var(--bg); border:1px solid var(--border); color:var(--text); width:32px; height:32px; border-radius:8px; cursor:pointer; font-size:13px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:20px; }
  .cal-dow{ text-align:center; font-size:10px; color:var(--text-muted); padding:2px 0 6px; font-weight:600; }
  .cal-cell{ aspect-ratio:2/3; border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:10.5px; border:1px solid var(--border); position:relative; font-weight:600; overflow:hidden; cursor:default; }
  .cal-cell.other{ opacity:0.32; }
  .cal-cell .d{ color:var(--text-muted); position:relative; z-index:1; }
  .cal-cell.has{ border-color:transparent; cursor:pointer; }
  .cal-cell.has .d{ color:rgba(255,255,255,0.97); text-shadow:0 1px 3px rgba(0,0,0,0.4); }
  .cal-cell .cover-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .cal-cell .cover-shade{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,0.45) 100%); }
  .cal-more{ position:absolute; bottom:2px; right:3px; font-size:7.5px; color:#fff; font-weight:800; z-index:1; text-shadow:0 1px 2px rgba(0,0,0,0.5); }
  .month-list{ margin-top:4px; }
  .month-empty{ text-align:center; color:var(--text-muted); font-size:13px; padding:24px 0; font-weight:500; }
  .month-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); cursor:pointer; }
  .month-row:last-child{ border-bottom:none; }
  .month-row .cov{ width:30px; height:42px; border-radius:4px; flex-shrink:0; object-fit:cover; background:var(--border); }
  .month-row .chip{ width:5px; height:30px; border-radius:3px; flex-shrink:0; }
  .month-row .bt{ font-size:13px; font-weight:600; }
  .month-row .bd{ font-size:11px; color:var(--text-muted); margin-top:1px; }

  /* 통계 */
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:22px; }
  .stat-box{ background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:14px; text-align:center; }
  .stat-box .v{ font-size:22px; font-weight:800; letter-spacing:-0.01em; }
  .stat-box .l{ font-size:10.5px; color:var(--text-muted); font-weight:600; margin-top:4px; }
  .bar-chart{ display:flex; align-items:flex-end; gap:5px; height:110px; margin-bottom:6px; }
  .bar-chart .bar-wrap{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
  .bar-chart .bar{ width:100%; background:var(--accent); border-radius:4px 4px 0 0; min-height:2px; }
  .bar-chart .bn{ font-size:9px; color:var(--text-muted); margin-top:2px; }
  .taglist{ display:flex; flex-direction:column; gap:8px; margin-top:6px; }
  .tagrow{ display:flex; justify-content:space-between; align-items:center; font-size:12.5px; }
  .tagrow .name{ font-weight:600; }
  .tagrow .cnt{ color:var(--text-muted); font-variant-numeric:tabular-nums; }
  .stat-empty{ text-align:center; color:var(--text-muted); font-size:13px; padding:30px 0; }

  /* 위시리스트 */
  .wish-row{ display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--border); }
  .wish-row:last-child{ border-bottom:none; }
  .wish-row .cov{ width:32px; height:46px; border-radius:4px; object-fit:cover; background:var(--border-2); flex-shrink:0; }
  .wish-row .covph{ width:32px; height:46px; border-radius:4px; background:var(--border-2); flex-shrink:0; }
  .wish-row .bt{ font-size:13px; font-weight:700; cursor:pointer; }
  .wish-row .bd{ font-size:11px; color:var(--text-muted); margin-top:1px; }
  .wish-row .start-btn{ margin-left:auto; background:var(--accent); color:#fff; border:none; border-radius:8px; padding:8px 12px; font-size:11.5px; font-weight:700; cursor:pointer; flex-shrink:0; }

  .fab{ position:fixed; right:18px; bottom:calc(20px + var(--safe-b)); width:56px; height:56px; border-radius:50%; background:var(--accent); border:none; color:#fff; font-size:27px; cursor:pointer; box-shadow:0 8px 20px rgba(91,91,214,0.35), 0 2px 6px rgba(0,0,0,0.08); display:flex; align-items:center; justify-content:center; z-index:20; }
  .fab:active{ transform:scale(0.95); }

  .modal-back{ position:fixed; inset:0; background:rgba(24,24,27,0.4); backdrop-filter:blur(3px); display:flex; align-items:flex-end; justify-content:center; z-index:50; overscroll-behavior:contain; touch-action:none; }
  @media(min-width:640px){ .modal-back{ align-items:center; padding:20px; } }
  .card{ background:var(--surface); color:var(--text); width:100%; max-width:440px; border-radius:20px 20px 0 0; max-height:90vh; max-height:90dvh; box-shadow:0 -10px 40px rgba(0,0,0,0.15); display:flex; flex-direction:column; overflow:hidden; touch-action:pan-y; }
  @media(min-width:640px){ .card{ border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,0.2); } }
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; padding:22px 18px 14px; flex-shrink:0; background:var(--surface); box-shadow:0 1px 0 var(--border); position:relative; z-index:2; }
  @media(min-width:640px){ .card-top{ padding:26px 24px 16px; } }
  .card-body{ flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; touch-action:pan-y; padding:14px 18px calc(22px + var(--safe-b)); }
  @media(min-width:640px){ .card-body{ padding:16px 24px 28px; } }
  .card-top .ct{ font-size:17px; font-weight:800; letter-spacing:-0.01em; }
  .card-top .cs{ font-size:12px; color:var(--text-muted); margin-top:4px; font-weight:500; }
  .card-close{ background:var(--bg); border:none; width:30px; height:30px; border-radius:8px; font-size:18px; color:var(--text-muted); cursor:pointer; flex-shrink:0; }
  .card-divider{ border-top:1px solid var(--border); margin:16px 0; }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:10.5px; letter-spacing:0.02em; text-transform:uppercase; color:var(--text-muted); font-weight:700; margin-bottom:6px; }
  .field input, .field textarea{ width:100%; border:1.5px solid var(--border-2); border-radius:10px; background:var(--bg); padding:12px; font-size:16px; color:var(--text); font-family:'Inter',sans-serif; outline:none; }
  .field textarea{ resize:vertical; min-height:64px; font-size:14px; }
  .field input:focus, .field textarea:focus{ border-color:var(--accent); background:var(--surface); }

  .status-picker{ display:flex; gap:6px; }
  .status-picker button{ flex:1; background:var(--bg); border:1.5px solid var(--border-2); color:var(--text-muted); border-radius:10px; padding:10px 4px; font-size:12px; font-weight:700; cursor:pointer; }
  .status-picker button.on{ background:var(--accent); border-color:var(--accent); color:#fff; }

  .search-row{ display:flex; gap:8px; align-items:flex-end; }
  .search-row .field{ flex:1; margin-bottom:0; }
  .btn-search{ background:var(--accent); color:#fff; border:none; border-radius:10px; padding:0 16px; font-size:13.5px; font-weight:700; cursor:pointer; white-space:nowrap; height:44px; }
  .btn-search:disabled{ opacity:0.5; }

  .results{ margin-top:12px; max-height:200px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .result-item{ display:flex; gap:10px; align-items:center; width:100%; text-align:left; background:var(--bg); border:1.5px solid var(--border); border-radius:12px; padding:8px 10px; margin-bottom:6px; cursor:pointer; }
  .result-item img{ width:32px; height:46px; object-fit:cover; border-radius:4px; flex-shrink:0; background:var(--border-2); }
  .result-item .rt{ font-size:13px; font-weight:700; color:var(--text); }
  .result-item .ra{ font-size:11px; color:var(--text-muted); margin-top:1px; }
  .no-result{ font-size:12.5px; color:var(--text-muted); padding:10px 2px; }
  .error-msg{ font-size:12.5px; color:var(--danger); background:rgba(224,82,82,0.08); padding:10px; border-radius:8px; }

  .quote-entry{ background:var(--bg); border:1px solid var(--border-2); border-radius:10px; padding:10px; margin-bottom:8px; }
  .quote-entry input{ width:100%; border:none; background:transparent; font-size:12px; font-weight:600; color:var(--text-muted); padding:0 0 6px; outline:none; }
  .quote-entry textarea{ width:100%; border:none; background:transparent; font-size:14px; color:var(--text); padding:0; outline:none; resize:vertical; min-height:40px; font-family:'Inter',sans-serif; }
  .quote-remove{ background:none; border:none; color:var(--danger); font-size:11px; font-weight:700; cursor:pointer; padding:4px 0 0; }
  .quote-toggle{ background:none; border:none; color:var(--accent); font-size:11.5px; font-weight:700; cursor:pointer; padding:6px 0 0; }
  .quote-list{ margin-top:8px; padding-top:8px; border-top:1px dashed var(--border); }
  .quote-item{ font-size:12.5px; color:var(--text); line-height:1.6; margin-bottom:8px; font-style:italic; }
  .quote-item .src{ display:block; font-size:11px; color:var(--text-muted); font-style:normal; font-weight:600; margin-top:2px; }
  .star-picker{ position:relative; display:inline-block; font-size:30px; letter-spacing:5px; cursor:pointer; line-height:1; -webkit-user-select:none; user-select:none; }
  .star-picker .bg{ color:var(--border-2); }
  .star-picker .fg{ position:absolute; top:0; left:0; overflow:hidden; color:var(--star); white-space:nowrap; width:0%; }
  .star-display{ position:relative; display:inline-block; font-size:11px; letter-spacing:1px; line-height:1; }
  .star-display .bg{ color:var(--border-2); }
  .star-display .fg{ position:absolute; top:0; left:0; overflow:hidden; color:var(--star); white-space:nowrap; }

  .btn-row{ display:flex; gap:8px; margin-top:6px; }
  .btn-add{ flex:1; background:var(--accent); color:#fff; border:none; border-radius:12px; padding:15px; font-size:14.5px; font-weight:700; cursor:pointer; }
  .btn-add:disabled{ opacity:0.4; }
  .btn-delete{ background:#fdeeee; color:var(--danger); border:none; border-radius:12px; padding:15px 18px; font-size:14.5px; font-weight:700; cursor:pointer; }
  .btn-secondary{ width:100%; background:var(--bg); border:1.5px solid var(--border-2); color:var(--text); border-radius:12px; padding:13px; font-size:13.5px; font-weight:700; cursor:pointer; margin-top:8px; }

  .settings-row{ display:flex; gap:8px; margin-top:6px; }
  .sync-card{ background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:14px; }
  .sync-card .row{ display:flex; align-items:center; gap:10px; }
  .sync-card .avatar{ width:34px; height:34px; border-radius:50%; background:var(--accent-soft); flex-shrink:0; object-fit:cover; }
  .sync-card .name{ font-size:13px; font-weight:700; }
  .sync-card .email{ font-size:11px; color:var(--text-muted); }
  .sync-card .status{ font-size:11px; color:var(--green); font-weight:600; margin-top:6px; }
  .google-btn{ width:100%; background:#fff; border:1.5px solid var(--border-2); color:var(--text); border-radius:10px; padding:12px; font-size:13.5px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
  .settings-row button{ flex:1; }

  .share-preview{ text-align:center; }
  .share-preview canvas{ max-width:100%; border-radius:12px; border:1px solid var(--border); margin-bottom:14px; }
  .share-actions{ display:flex; gap:8px; }

  .hidden{ display:none !important; }
  @media(max-width:360px){ .stats .num{ font-size:32px; } h1.title{ font-size:21px; } }
</style>
</head>
<body>

<div class="wrap">
  <div class="header-row">
    <div>
      <h1 class="title" id="appTitle">독서기록</h1>
      <p class="subtitle" id="appSubtitle">책을 검색하면 페이지 수를 자동으로 가져와요</p>
    </div>
    <button class="header-menu" onclick="openTitleModal()" aria-label="설정">⋯</button>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabShelf" onclick="switchView('shelf')">책장</button>
    <button class="tab" id="tabCalendar" onclick="switchView('calendar')">캘린더</button>
    <button class="tab" id="tabStats" onclick="switchView('stats')">통계</button>
    <button class="tab" id="tabWishlist" onclick="switchView('wishlist')">위시리스트</button>
  </div>

  <div class="panel">
    <div id="shelfView"></div>
    <div id="calendarView" class="hidden"></div>
    <div id="statsView" class="hidden"></div>
    <div id="wishlistView" class="hidden"></div>
  </div>
</div>

<button class="fab" onclick="openAddModal()" aria-label="책 추가">+</button>

<!-- 책 추가/수정 모달 -->
<div id="addModal" class="modal-back hidden">
  <div class="card">
    <div class="card-top">

<script>
/* ---------------- 데이터 ---------------- */
let books = JSON.parse(localStorage.getItem('reading-books') || '[]');
// 이전 버전 데이터 마이그레이션 (status, tags 없는 경우 보정)
books = books.map(b => ({
  status: 'completed', tags: [], startDate: null,
  ...b,
  tags: b.tags || []
}));
saveBooksRaw();

let currentMonth = new Date();
let currentView = 'shelf';
let selectedCover = null, selectedDepthMm = null, selectedSpineMm = null;
let currentRating = 0, currentStatus = 'completed', editingId = null;

// 팝업이 열려있는 동안 배경(body) 스크롤을 막고, 팝업 안에서만 스크롤되게 함
let lockedScrollY = 0, modalLockCount = 0;
function lockBodyScroll(){
  if(modalLockCount===0){
    lockedScrollY = window.scrollY;
    document.body.style.position = 'fixed';
    document.body.style.top = `-${lockedScrollY}px`;
    document.body.style.left = '0';
    document.body.style.right = '0';
    document.body.style.width = '100%';
  }
  modalLockCount++;
}
function unlockBodyScroll(){
  modalLockCount = Math.max(0, modalLockCount-1);
  if(modalLockCount===0){
    document.body.style.position = '';
    document.body.style.top = '';
    document.body.style.left = '';
    document.body.style.right = '';
    document.body.style.width = '';
    window.scrollTo(0, lockedScrollY);
  }
}
let currentQuotes = [];
let expandedBooks = new Set();
let startDateManuallyEdited = false;
let activeTags = [];

const DEFAULT_TITLE = '독서기록';
const DEFAULT_SUBTITLE = '책을 검색하면 페이지 수를 자동으로 가져와요';
const PALETTE = ['#5b5bd6','#e0748c','#3fa88a','#e8a23f','#4a90d9','#9b6fd6','#e0645a','#3fb5b5'];

function colorFor(seed){ let h=0; for(let i=0;i<seed.length;i++){ h=(h*31+seed.charCodeAt(i))>>>0; } return PALETTE[h%PALETTE.length]; }
function widthFor(book){
  // 폭은 대충 고정 (78~86% 사이 살짝만 변주) - 지그재그는 offsetFor가 담당
  let h=0; const seed=book.title;
  for(let i=0;i<seed.length;i++){ h=(h*17+seed.charCodeAt(i))>>>0; }
  return 78 + (h%9);
}
function offsetFor(book){
  // 책마다 좌우로 살짝 어긋나게 배치해서 지그재그로 쌓인 느낌을 줌 (-9% ~ +9%)
  let h=0; const seed='zz'+book.title;
  for(let i=0;i<seed.length;i++){ h=(h*31+seed.charCodeAt(i))>>>0; }
  return (h%19) - 9;
}
const MM_PER_PAGE=0.07, COVER_MM=3;
function thicknessMm(pages){ return pages*MM_PER_PAGE+COVER_MM; }
const PX_PER_MM=1.7;
function spineHeightPx(book){ const mm=book.depthMm||thicknessMm(book.pages); return Math.max(26, Math.min(mm*PX_PER_MM,150)); }
function heightLabel(totalPages,bookCount){
  const cm=((totalPages*MM_PER_PAGE)+(bookCount*COVER_MM))/10;
  if(cm<1) return null;
  return cm>=100 ? `${(cm/100).toFixed(2)}m` : `${cm.toFixed(1)}cm`;
}

const HEIGHT_OBJECTS = [
  {name:'아이폰', emoji:'📱', cm:15},
  {name:'아이패드', emoji:'📱', cm:25},
  {name:'A4 용지', emoji:'📄', cm:30},
  {name:'볼링핀', emoji:'🎳', cm:38},
  {name:'신생아 키', emoji:'👶', cm:50},
  {name:'우산', emoji:'☂️', cm:85},
  {name:'킥보드', emoji:'🛴', cm:85},
  {name:'기타', emoji:'🎸', cm:100},
  {name:'초등학생 1학년 키', emoji:'🎒', cm:120},
  {name:'스노보드', emoji:'🏂', cm:150},
  {name:'성인 키', emoji:'🧍', cm:165},
  {name:'냉장고', emoji:'🧊', cm:180},
  {name:'현관문', emoji:'🚪', cm:200},
  {name:'농구 골대', emoji:'🏀', cm:305},
  {name:'버스 높이', emoji:'🚌', cm:330},
  {name:'2층 건물', emoji:'🏠', cm:600},
  {name:'전봇대', emoji:'🔌', cm:800},
];

function heightObjectLabel(totalPages,bookCount){
  const cm=((totalPages*MM_PER_PAGE)+(bookCount*COVER_MM))/10;
  if(cm<8) return null;
  let best=null, bestDiff=Infinity;
  HEIGHT_OBJECTS.forEach(o=>{
    const diff = Math.abs(Math.log(cm/o.cm));
    if(diff<bestDiff){ bestDiff=diff; best=o; }
  });
  if(!best) return null;
  const ratio = cm/best.cm;
  if(ratio>=0.8 && ratio<=1.35) return `${best.emoji} ${best.name} 높이만큼이에요`;
  if(ratio>1.35) return `${best.emoji} ${best.name} ${ratio.toFixed(1)}개를 쌓은 높이예요`;
  return `${best.emoji} ${best.name} 높이의 ${Math.round(ratio*100)}% 정도예요`;
}
function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, c=> ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function starHtml(rating){
  rating = rating||0;
  const pct = Math.max(0, Math.min(100, (rating/5)*100));
  return `<span class="star-display"><span class="bg">★★★★★</span><span class="fg" style="width:${pct}%">★★★★★</span></span>`;
}
function toLocalDateStr(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }

function saveBooksRaw(){ localStorage.setItem('reading-books', JSON.stringify(books)); }
function saveBooks(){ saveBooksRaw(); pushToCloud(); }

function extractDominantColor(url){
  return new Promise((resolve)=>{
    try{
      const img=new Image(); img.crossOrigin='anonymous';
      img.onload=()=>{
        try{
          const c=document.createElement('canvas'); c.width=16; c.height=16;
          const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,16,16);
          const data=ctx.getImageData(0,0,16,16).data;
          let r=0,g=0,b=0,n=0;
          for(let i=0;i<data.length;i+=4){ if(data[i+3]<100) continue; r+=data[i]; g+=data[i+1]; b+=data[i+2]; n++; }
          if(n===0){ resolve(null); return; }
          r=Math.round(r/n); g=Math.round(g/n); b=Math.round(b/n);
          const lum=(r*299+g*587+b*114)/1000;
          if(lum>235||lum<25){ resolve(null); return; }
          resolve('#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join(''));
        }catch(e){ resolve(null); }
      };
      img.onerror=()=>resolve(null); img.src=url;
    }catch(e){ resolve(null); }
  });
}

/* ---------------- 탭 전환 ---------------- */
function switchView(view){
  currentView=view;
  ['Shelf','Calendar','Stats','Wishlist'].forEach(v=>{
    document.getElementById('tab'+v).classList.toggle('active', view===v.toLowerCase());

/* ---------------- 타이틀 편집 ---------------- */
function applyTitleFromStorage(){

  document.getElementById('appSubtitle').textContent = localStorage.getItem('app-subtitle') || DEFAULT_SUBTITLE;
}

/* ---------------- 데이터 백업 ---------------- */
function exportData(){
  const blob = new Blob([JSON.stringify(books, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  a.href = url;
  a.download = `독서기록-백업-${toLocalDateStr(d)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importData(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const imported = JSON.parse(e.target.result);
      if(!Array.isArray(imported)) throw new Error('형식 오류');
      const existingIds = new Set(books.map(b=>b.id));
      let added = 0;
      imported.forEach(b=>{
        if(b && b.title && !existingIds.has(b.id)){
          books.push({ status:'completed', tags:[], startDate:null, ...b });
          existingIds.add(b.id);
          added++;
        }
      });
      saveBooks(); render();
      alert(`${added}권을 가져왔어요! (중복은 자동으로 건너뜀)`);
    }catch(err){
      alert('파일을 읽을 수 없어요. 이 앱에서 내보낸 JSON 파일인지 확인해주세요.');
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

/* ---------------- 별점/상태 선택 ---------------- */
function pickStar(e){
  const rect = e.currentTarget.getBoundingClientRect();
  const frac = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
  let val = Math.ceil(frac*10)/2; // 0.5 단위로 반올림
  val = Math.min(5, Math.max(0.5, val));
  currentRating = (currentRating===val) ? 0 : val;
  renderStars();
}
function renderStars(){
  const pct = Math.max(0, Math.min(100, (currentRating/5)*100));
  document.getElementById('starFg').style.width = pct+'%';
  document.getElementById('ratingLabel').textContent = currentRating>0 ? `${currentRating}` : '';
}

function renderQuotesContainer(){
  const el = document.getElementById('quotesContainer');
  if(!el) return;
  el.innerHTML = currentQuotes.map((q,i)=>`
    <div class="quote-entry">
      <input type="text" placeholder="페이지 또는 챕터 (예: p.152, 3장)" value="${(q.page||'').replace(/"/g,'&quot;')}" oninput="updateQuote(${i},'page',this.value)">
      <textarea placeholder="인상 깊었던 문장을 적어보세요" oninput="updateQuote(${i},'text',this.value)">${(q.text||'')}</textarea>
      <button type="button" class="quote-remove" onclick="removeQuote(${i})">이 문구 삭제</button>
    </div>
  `).join('');
}
function addQuoteField(){ currentQuotes.push({page:'', text:''}); renderQuotesContainer(); }
function updateQuote(i, field, val){ if(currentQuotes[i]) currentQuotes[i][field]=val; }
function removeQuote(i){ currentQuotes.splice(i,1); renderQuotesContainer(); }

function toggleBookExpand(id, event){

  document.getElementById('tagsField').style.display = '';

}

  document.getElementById('dateInput').value='';

function openAddModal(defaultStatus){
  editingId=null; selectedCover=null; selectedDepthMm=null; selectedSpineMm=null; currentRating=0;
  currentQuotes=[];
  startDateManuallyEdited=false;
  document.getElementById('modalTitle').textContent='책 기록하기';

  renderQuotesContainer();

}

// 완독 날짜가 바뀌면 시작 날짜를 자동으로 그 전날로 채움 - 단, 사용자가 시작 날짜를 직접 수정한 뒤에는 더 이상 덮어쓰지 않음
function autoFillStartDate(){
  if(startDateManuallyEdited) return;
  const completedVal = document.getElementById('dateInput').value;
  if(!completedVal) return;
  const d = new Date(completedVal + 'T00:00:00');
  if(isNaN(d)) return;
  d.setDate(d.getDate()-1);
  document.getElementById('startDateInput').value = toLocalDateStr(d);
}

function openEditModal(id){
  const book = books.find(b=>b.id===id);
  if(!book) return;
  editingId=id; selectedCover=book.cover||null; selectedDepthMm=book.depthMm||null; selectedSpineMm=book.spineMm||null;
  currentRating=book.rating||0;
  currentQuotes=(book.quotes||[]).map(q=>({...q}));
  startDateManuallyEdited=false;
  document.getElementById('modalTitle').textContent='책 수정하기';
  document.getElementById('modalSubtitle').textContent='내용을 고치거나 삭제할 수 있어요';
  document.getElementById('searchSection').classList.add('hidden');
  document.getElementById('deleteBtn').classList.remove('hidden');
  document.getElementById('titleInput').value=book.title;
  document.getElementById('pagesInput').value=book.pages||'';
  document.getElementById('tagsInput').value=(book.tags||[]).join(', ');
  document.getElementById('startDateInput').value=book.startDate||'';
  document.getElementById('dateInput').value=book.completedDate||'';
  document.getElementById('reviewInput').value=book.review||'';
  renderStars();
  renderQuotesContainer();
  setStatus(book.status||'completed');
  document.getElementById('finishBtn').classList.toggle('hidden', book.status!=='reading');
  document.getElementById('addModal').classList.remove('hidden');
  lockBodyScroll();
}

function closeAddModal(){
  document.getElementById('addModal').classList.add('hidden');
  resetModalFields();
  selectedCover=null; selectedDepthMm=null; selectedSpineMm=null; currentRating=0; editingId=null;
  currentQuotes=[];
  unlockBodyScroll();
}

function finishReading(){
  if(editingId===null) return;
  document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];
  setStatus('completed');
}

function deleteFromModal(){
  if(editingId===null) return;
  if(!confirm('이 책을 삭제할까요?')) return;
  books = books.filter(b=>b.id!==editingId);
  saveBooks(); closeAddModal(); render();
}

/* ---------------- 검색 ---------------- */
async function searchBooks(){
  const query = document.getElementById('searchInput').value.trim();
  if(!query) return;
  const btn = document.getElementById('searchBtn'), resultsDiv = document.getElementById('searchResults');
  btn.textContent='검색중'; btn.disabled=true; resultsDiv.innerHTML='';
  try{
    const res = await fetch(`/api/search?query=${encodeURIComponent(query)}`);
    const data = await res.json();
    if(data.error){ resultsDiv.innerHTML=`<div class="error-msg">${data.error}</div>`; return; }
    if(!data.books || data.books.length===0){ resultsDiv.innerHTML=`<div class="no-result">검색 결과가 없어요. 직접 입력해주세요.</div>`; return; }
    resultsDiv.innerHTML = data.books.map((book,i)=>`
      <button class="result-item" onclick="selectBook(${i})">
        ${book.cover?`<img src="${book.cover}" loading="lazy"/>`:''}
        <div><div class="rt">${book.title}</div><div class="ra">${book.author||''}</div></div>
      </button>`).join('');
    window._searchResults = data.books;
  }catch(e){ resultsDiv.innerHTML=`<div class="error-msg">검색 중 오류가 발생했습니다.</div>`; }
  finally{ btn.textContent='검색'; btn.disabled=false; }
}

// "국내도서>소설/시/희곡>한국소설>한국 현대소설" 같은 카테고리 경로를 태그 배열로 변환
function categoryToTags(categoryName){
  if(!categoryName) return [];
  const parts = categoryName.split('>').map(p=>p.trim()).filter(Boolean);
  const skip = new Set(['국내도서','외국도서','eBook']);
  const tags = [];
  parts.forEach(p=>{
    if(skip.has(p)) return;
    p.split('/').forEach(sub=>{ const t=sub.trim(); if(t) tags.push(t); });
  });
  // 너무 세부적인 마지막 항목은 제외하고 최대 3개까지만 (너무 길어지지 않게)
  return [...new Set(tags)].slice(0, 3);
}

async function selectBook(index){
  const book = window._searchResults[index];
  document.getElementById('titleInput').value = book.title;
  document.getElementById('pagesInput').value=''; document.getElementById('pagesInput').placeholder='가져오는 중...';
  document.getElementById('tagsInput').value = categoryToTags(book.categoryName).join(', ');
  selectedCover = book.cover||null; selectedDepthMm=null; selectedSpineMm=null;
  try{
    const res = await fetch(`/api/detail/${book.itemId}`);
    const data = await res.json();
    if(data.cover) selectedCover = data.cover;
    if(data.depthMm) selectedDepthMm = data.depthMm;
    if(data.heightMm) selectedSpineMm = data.heightMm;
    if(data.categoryName){ document.getElementById('tagsInput').value = categoryToTags(data.categoryName).join(', '); }
    if(data.pages && data.pages>0){ document.getElementById('pagesInput').value = data.pages; }
    else{ document.getElementById('pagesInput').placeholder='예: 472'; alert('페이지 수를 찾을 수 없어요. 직접 입력해주세요.'); }
  }catch(e){ document.getElementById('pagesInput').placeholder='예: 472'; alert('페이지 수 조회 실패. 직접 입력해주세요.'); }
}

/* ---------------- 저장 ---------------- */
async function saveBook(){
  const title = document.getElementById('titleInput').value.trim();
  if(!title){ alert('책 제목을 입력해주세요!'); return; }

  const pages = parseInt(document.getElementById('pagesInput').value) || 0;
  if(currentStatus!=='wishlist' && (!pages || pages<=0)){ alert('올바른 페이지 수를 입력해주세요!'); return; }

  const tags = document.getElementById('tagsInput').value.split(',').map(t=>t.trim()).filter(Boolean);
  const startDate = document.getElementById('startDateInput').value || null;
  const completedDate = document.getElementById('dateInput').value || null;
  const review = document.getElementById('reviewInput').value.trim();
  const quotes = currentStatus==='completed' ? currentQuotes.filter(q=>q.text && q.text.trim()).map(q=>({page:(q.page||'').trim(), text:q.text.trim()})) : [];

  if(currentStatus==='completed' && !completedDate){ alert('완독 날짜를 입력해주세요!'); return; }

  let color = colorFor(title);
  if(selectedCover){ const extracted = await extractDominantColor(selectedCover); if(extracted) color = extracted; }

  const payload = {
    title, pages, tags, status: currentStatus,
    startDate: currentStatus==='wishlist' ? null : startDate,
    completedDate: currentStatus==='completed' ? completedDate : null,
    rating: currentStatus==='completed' ? currentRating : 0,
    review: currentStatus==='completed' ? review : '',
    quotes,
    cover: selectedCover, color,
    depthMm: selectedDepthMm, spineMm: selectedSpineMm
  };

  if(editingId!==null){
    const idx = books.findIndex(b=>b.id===editingId);
    if(idx>-1){
      books[idx] = { ...books[idx], ...payload,
        cover: selectedCover || books[idx].cover,
        color: selectedCover ? color : books[idx].color,
        depthMm: selectedDepthMm || books[idx].depthMm,
        spineMm: selectedSpineMm || books[idx].spineMm };
    }
  }else{
    books.push({ id: Date.now(), ...payload });
  }
  saveBooks(); closeAddModal(); render();
}

function markWishStart(id){
  const book = books.find(b=>b.id===id);
  if(!book) return;
  book.status='reading'; book.startDate = new Date().toISOString().split('T')[0];
  saveBooks(); render();
}

/* ---------------- 렌더 공통 ---------------- */
function render(){
  if(currentView==='shelf') renderShelf();
  else if(currentView==='calendar') renderCalendar();
  else if(currentView==='stats') renderStats();
  else if(currentView==='wishlist') renderWishlist();
}

function allTags(list){
  const s = new Set();
  list.forEach(b => (b.tags||[]).forEach(t=>s.add(t)));
  return [...s];
}

/* ---------------- 책장 (책쌓기) ---------------- */
let periodYear = 'all', periodMonth = 'all', bookListSort = 'recent';

function getAvailableYears(list){
  const s = new Set();
  list.forEach(b=>{ if(b.completedDate) s.add(new Date(b.completedDate).getFullYear()); });
  return [...s].sort((a,b)=>b-a);
}
function inPeriod(book){
  if(periodYear==='all') return true;
  if(!book.completedDate) return false;
  const d = new Date(book.completedDate);
  if(String(d.getFullYear())!==periodYear) return false;
  if(periodMonth!=='all' && String(d.getMonth()+1)!==periodMonth) return false;
  return true;
}
function onPeriodYearChange(v){ periodYear=v; periodMonth='all'; renderShelf(); }
function onPeriodMonthChange(v){ periodMonth=v; renderShelf(); }
function setBookListSort(v){ bookListSort=v; renderShelf(); }
function sortedBookList(list){
  const arr=[...list];
  if(bookListSort==='recent') arr.sort((a,b)=> new Date(b.completedDate)-new Date(a.completedDate));
  else if(bookListSort==='oldest') arr.sort((a,b)=> new Date(a.completedDate)-new Date(b.completedDate));
  else if(bookListSort==='title') arr.sort((a,b)=> a.title.localeCompare(b.title,'ko'));
  else if(bookListSort==='rating') arr.sort((a,b)=> (b.rating||0)-(a.rating||0));
  return arr;
}

  if(hLabel) html += `<div class="height">📏 다 쌓으면 약 ${hLabel}</div>`;
  if(hObjLabel) html += `<div style="font-size:12px;color:var(--text-muted);margin-top:8px;font-weight:500">${hObjLabel}</div>`;
  html += `</div>`;

  html += `<div class="shelf-area">`;
  if(filtered.length===0){
    html += `<div class="empty-shelf">${completed.length===0 ? '아직 쌓은 책이 없어요.<br/>오른쪽 아래 + 버튼으로 첫 책을 올려보세요.' : '이 조건에 해당하는 책이 없어요.'}</div>`;

      const w = widthFor(book), h = spineHeightPx(book), off = offsetFor(book);
      const bgStyle = (book.cover && getStackStyle()==='cover')
        ? `background-image:linear-gradient(180deg, rgba(0,0,0,0.08), rgba(0,0,0,0.6)), url('${book.cover}'); background-size:cover; background-position:center;`
        : `background:${book.color};`;

        <div class="spine-label"><span class="t">${book.title}</span><span class="p">${book.pages}p</span></div>

          </div>
          <div class="bp">${book.pages}p</div>
        </div>

    });
    html += `</div>`;

  document.getElementById('shelfView').innerHTML = html;
}

function toggleTag(t){
  const i = activeTags.indexOf(t);
  if(i>-1) activeTags.splice(i,1); else activeTags.push(t);
  render();
}

/* ---------------- 캘린더 ---------------- */
function renderCalendar(){
  const year=currentMonth.getFullYear(), month=currentMonth.getMonth();
  const firstDay=new Date(year,month,1), lastDay=new Date(year,month+1,0);
  const startDate=new Date(firstDay); startDate.setDate(startDate.getDate()-firstDay.getDay());
  const endDate=new Date(lastDay); endDate.setDate(endDate.getDate()+(6-lastDay.getDay()));

  const monthBooks = books.filter(b=>{ if(b.status!=='completed'||!b.completedDate) return false; const d=new Date(b.completedDate); return d.getFullYear()===year&&d.getMonth()===month; });
  const monthPages = monthBooks.reduce((s,b)=>s+b.pages,0);
  const byDate={}; monthBooks.forEach(b=>{ (byDate[b.completedDate]=byDate[b.completedDate]||[]).push(b); });

  const days=[]; const cursor=new Date(startDate);
  while(cursor<=endDate){ days.push(new Date(cursor)); cursor.setDate(cursor.getDate()+1); }
  const dow=['일','월','화','수','목','금','토'];

  let html = `<div class="section-h"><div class="h">캘린더</div><button class="icon-btn" onclick="openShareCalendarCard()">📤 이미지</button></div>`;
  html += `<div class="cal-summary">
    <div class="box"><div class="v">${monthBooks.length}권</div><div class="l">이달 완독</div></div>
    <div class="box"><div class="v">${monthPages.toLocaleString()}p</div><div class="l">이달 읽은 페이지</div></div>
  </div>`;
  html += `<div class="cal-head"><button class="cal-nav" onclick="changeMonth(-1)">←</button><div class="m">${year}년 ${month+1}월</div><button class="cal-nav" onclick="changeMonth(1)">→</button></div>`;
  html += `<div class="cal-grid">`;
  dow.forEach(d=> html += `<div class="cal-dow">${d}</div>`);
  days.forEach(day=>{
    const dateStr=toLocalDateStr(day); const dayBooks=byDate[dateStr]||[]; const isOther=day.getMonth()!==month; const main=dayBooks[0];
    if(main){
      html += `<div class="cal-cell has ${isOther?'other':''}" style="${main.cover?'':'background:'+main.color}" onclick="openEditModal(${main.id})" title="${dayBooks.map(b=>b.title).join(', ')}">
        ${main.cover?`<img class="cover-img" src="${main.cover}" loading="lazy"/><div class="cover-shade"></div>`:''}
        <span class="d">${day.getDate()}</span>${dayBooks.length>1?`<span class="cal-more">+${dayBooks.length-1}</span>`:''}
      </div>`;
    }else{
      html += `<div class="cal-cell ${isOther?'other':''}"><span class="d">${day.getDate()}</span></div>`;
    }
  });
  html += `</div>`;

  html += `<div class="month-list"><div class="h" style="margin-bottom:10px;font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:var(--text-muted);font-weight:700">이달의 완독</div>`;
  if(monthBooks.length===0){ html += `<div class="month-empty">이 달에 완독한 책이 없어요</div>`; }
  else{
    [...monthBooks].sort((a,b)=>new Date(a.completedDate)-new Date(b.completedDate)).forEach(book=>{
      html += `<div class="month-row" onclick="openEditModal(${book.id})">
        ${book.cover?`<img class="cov" src="${book.cover}" loading="lazy"/>`:`<div class="chip" style="background:${book.color}"></div>`}
        <div><div class="bt">${book.title}</div><div class="bd">${book.pages}p · ${book.completedDate}</div></div>
      </div>`;
    });
  }
  html += `</div>`;
  document.getElementById('calendarView').innerHTML = html;
}
function changeMonth(delta){ currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth()+delta, 1); renderCalendar(); }

/* ---------------- 통계 ---------------- */
function renderStats(){
  const completed = books.filter(b=>b.status==='completed' && b.completedDate);
  if(completed.length===0){
    document.getElementById('statsView').innerHTML = `<div class="stat-empty">아직 완독한 책이 없어요.<br/>책을 기록하면 통계가 보여요.</div>`;
    return;
  }
  const now = new Date();
  const thisYear = now.getFullYear();
  const yearBooks = completed.filter(b=> new Date(b.completedDate).getFullYear()===thisYear);
  const totalPages = completed.reduce((s,b)=>s+b.pages,0);
  const yearPages = yearBooks.reduce((s,b)=>s+b.pages,0);
  const rated = completed.filter(b=>b.rating>0);
  const avgRating = rated.length ? (rated.reduce((s,b)=>s+b.rating,0)/rated.length).toFixed(1) : '-';
  const longest = completed.reduce((a,b)=> b.pages>(a?a.pages:0) ? b : a, null);

  const monthCounts = Array(12).fill(0);
  yearBooks.forEach(b=>{ monthCounts[new Date(b.completedDate).getMonth()]++; });
  const maxMonth = Math.max(...monthCounts, 1);

  const tagCounts = {};
  completed.forEach(b=> (b.tags||[]).forEach(t=> tagCounts[t]=(tagCounts[t]||0)+1));
  const topTags = Object.entries(tagCounts).sort((a,b)=>b[1]-a[1]).slice(0,6);

  let html = `<div class="stat-grid">
    <div class="stat-box"><div class="v">${completed.length}권</div><div class="l">전체 완독</div></div>
    <div class="stat-box"><div class="v">${totalPages.toLocaleString()}p</div><div class="l">전체 읽은 페이지</div></div>
    <div class="stat-box"><div class="v">${yearBooks.length}권</div><div class="l">${thisYear}년 완독</div></div>
    <div class="stat-box"><div class="v">${yearPages.toLocaleString()}p</div><div class="l">${thisYear}년 페이지</div></div>
    <div class="stat-box"><div class="v">${avgRating}${avgRating!=='-'?' ★':''}</div><div class="l">평균 별점</div></div>
    <div class="stat-box"><div class="v">${longest?longest.pages:'-'}p</div><div class="l">가장 두꺼운 책</div></div>
  </div>`;

  html += `<div class="section-h"><div class="h">${thisYear}년 월별 완독</div></div>`;
  html += `<div class="bar-chart">`;
  monthCounts.forEach((c,i)=>{
    const pct = Math.max((c/maxMonth)*100, c>0?8:0);
    html += `<div class="bar-wrap"><div class="bar" style="height:${pct}%"></div><div class="bn">${i+1}</div></div>`;
  });
  html += `</div>`;

  if(topTags.length>0){
    html += `<div class="card-divider"></div><div class="section-h"><div class="h">많이 읽은 태그</div></div><div class="taglist">`;
    topTags.forEach(([t,c])=>{ html += `<div class="tagrow"><span class="name">#${t}</span><span class="cnt">${c}권</span></div>`; });
    html += `</div>`;
  }

  document.getElementById('statsView').innerHTML = html;
}

      html += `<div class="wish-row">
        ${book.cover?`<img class="cov" src="${book.cover}" loading="lazy" onclick="openEditModal(${book.id})"/>`:`<div class="covph" style="background:${book.color}" onclick="openEditModal(${book.id})"></div>`}
        <div style="flex:1;min-width:0"><div class="bt" onclick="openEditModal(${book.id})">${book.title}</div>
        ${book.tags&&book.tags.length?`<div class="tags">${book.tags.map(t=>`<span>#${t}</span>`).join('')}</div>`:''}</div>
        <button class="start-btn" onclick="markWishStart(${book.id})">읽기 시작</button>
      </div>`;
    });
  }
  document.getElementById('wishlistView').innerHTML = html;
}

/* ---------------- 이미지 카드 생성 (공유) ---------------- */
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

let currentShareBlob = null;

async function openShareStackCard(){
  const completed = books.filter(b=>b.status==='completed');
  if(completed.length===0){ alert('완독한 책이 있어야 이미지를 만들 수 있어요.'); return; }
  const sorted = [...completed].sort((a,b)=> new Date(a.completedDate)-new Date(b.completedDate));
  const totalPages = completed.reduce((s,b)=>s+b.pages,0);
  const hLabel = heightLabel(totalPages, completed.length);
  const hObjLabel = heightObjectLabel(totalPages, completed.length);

  // 표지 이미지를 서버 프록시로 미리 로드 (캔버스에 안전하게 그리기 위함)
  document.getElementById('shareModal').classList.remove('hidden');
  lockBodyScroll();
  const loadingCanvas = document.getElementById('shareCanvas');
  loadingCanvas.width=800; loadingCanvas.height=200;
  const lctx = loadingCanvas.getContext('2d');
  lctx.fillStyle='#fafafa'; lctx.fillRect(0,0,800,200);
  lctx.fillStyle='#8a8a92'; lctx.font='500 16px Inter, sans-serif'; lctx.textAlign='center';
  lctx.fillText('이미지를 준비하는 중...', 400, 100); lctx.textAlign='left';

  const useCover = getStackStyle()==='cover';
  const uniqueCovers = useCover ? [...new Set(sorted.map(b=>b.cover).filter(Boolean))] : [];
  const loadedPairs = await Promise.all(uniqueCovers.map(async url => [url, await loadImage(proxied(url))]));
  const imageMap = new Map(loadedPairs);

  const W = 800, padX=56;
  const SCALE = W/420; // 폰 화면 대비 캔버스가 넓은 만큼 두께도 비례해서 키움 (화면과 동일한 비율 유지)
  const gap=5;
  const stackH = sorted.reduce((s,b)=> s + spineHeightPx(b)*SCALE + gap, 0);
  const H = 340 + stackH + 100;

  const canvas = document.getElementById('shareCanvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  // 배경
  ctx.fillStyle = '#fafafa'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#18181b';
  ctx.font = '800 44px Inter, sans-serif';
  ctx.fillText(`${completed.length}권`, padX, 90);
  ctx.fillStyle = '#8a8a92'; ctx.font='500 20px Inter, sans-serif';
  ctx.fillText(`읽은 책 · 총 ${totalPages.toLocaleString()}페이지`, padX, 126);
  if(hLabel){
    ctx.fillStyle = '#5b5bd6'; ctx.font='700 20px Inter, sans-serif';
    ctx.fillText(`📏 다 쌓으면 약 ${hLabel}`, padX, 160);
  }
  if(hObjLabel){
    ctx.fillStyle = '#8a8a92'; ctx.font='500 17px Inter, sans-serif';
    ctx.fillText(hObjLabel, padX, 190);
  }

  let y = 240;
  const maxW = W - padX*2;
  [...sorted].reverse().forEach(book=>{
    const wPct = widthFor(book)/100;
    const w = maxW * wPct;
    const rowH = spineHeightPx(book) * SCALE;
    const off = offsetFor(book)/100;
    const x = padX + (maxW-w)/2 + maxW*off*0.5;
    const img = (useCover && book.cover) ? imageMap.get(book.cover) : null;

    roundRect(ctx, x, y, w, rowH, 6);
    if(img){
      ctx.save(); ctx.clip();
      // 표지 이미지에서 가운데 부분을 크롭해서 채움 (object-fit: cover)
      const scale = Math.max(w/img.width, rowH/img.height);
      const iw=img.width*scale, ih=img.height*scale;
      ctx.drawImage(img, x+(w-iw)/2, y+(rowH-ih)/2, iw, ih);
      // 텍스트 가독성을 위한 어두운 그라데이션
      const grad = ctx.createLinearGradient(x,y,x,y+rowH);
      grad.addColorStop(0,'rgba(0,0,0,0.05)'); grad.addColorStop(1,'rgba(0,0,0,0.6)');
      ctx.fillStyle=grad; ctx.fillRect(x,y,w,rowH);
      ctx.restore();
    }else{
      ctx.fillStyle = book.color; ctx.fill();
    }

    if(rowH >= 24){
      ctx.fillStyle = 'rgba(255,255,255,0.97)';
      ctx.font = '700 19px Inter, sans-serif';
      let title = book.title;
      while(ctx.measureText(title).width > w-130 && title.length>3){ title = title.slice(0,-2); }
      if(title !== book.title) title += '…';
      ctx.fillText(title, x+20, y+rowH/2+6);
      ctx.textAlign='right'; ctx.font='700 16px Inter, sans-serif';
      ctx.fillText(`${book.pages}p`, x+w-16, y+rowH/2+6);
      ctx.textAlign='left';
    }
    y += rowH+gap;
  });

  ctx.fillStyle = '#c4c4cc'; ctx.font='500 13px Inter, sans-serif';
  ctx.fillText(`${toLocalDateStr(new Date())} · Made with 독서기록`, padX, H-30);

  document.getElementById('shareModal').classList.remove('hidden');
  canvas.toBlob(blob=> currentShareBlob = blob, 'image/png');
}

function proxied(url){ return url ? `/api/image-proxy?url=${encodeURIComponent(url)}` : url; }
function loadImage(url){
  return new Promise((resolve)=>{
    if(!url){ resolve(null); return; }
    const img = new Image();
    img.onload = ()=> resolve(img);
    img.onerror = ()=> resolve(null);
    img.src = url;
  });
}

async function openShareCalendarCard(){
  const year=currentMonth.getFullYear(), month=currentMonth.getMonth();
  const monthBooks = books.filter(b=>{ if(b.status!=='completed'||!b.completedDate) return false; const d=new Date(b.completedDate); return d.getFullYear()===year&&d.getMonth()===month; });
  const monthPages = monthBooks.reduce((s,b)=>s+b.pages,0);
  const byDate={}; monthBooks.forEach(b=>{ (byDate[b.completedDate]=byDate[b.completedDate]||[]).push(b); });

  const firstDay=new Date(year,month,1), lastDay=new Date(year,month+1,0);
  const startDate=new Date(firstDay); startDate.setDate(startDate.getDate()-firstDay.getDay());
  const endDate=new Date(lastDay); endDate.setDate(endDate.getDate()+(6-lastDay.getDay()));
  const days=[]; const cursor=new Date(startDate);
  while(cursor<=endDate){ days.push(new Date(cursor)); cursor.setDate(cursor.getDate()+1); }
  const weeks = Math.ceil(days.length/7);

  // 표지 이미지를 서버 프록시를 통해 미리 로드 (CORS 문제 없이 캔버스에 그리기 위함)
  const uniqueCovers = [...new Set(monthBooks.map(b=>b.cover).filter(Boolean))];
  document.getElementById('shareModal').classList.remove('hidden');
  lockBodyScroll();
  const canvasLoading = document.getElementById('shareCanvas');
  canvasLoading.width=800; canvasLoading.height=200;
  const lctx = canvasLoading.getContext('2d');
  lctx.fillStyle='#fafafa'; lctx.fillRect(0,0,800,200);
  lctx.fillStyle='#8a8a92'; lctx.font='500 16px Inter, sans-serif'; lctx.textAlign='center';
  lctx.fillText('이미지를 준비하는 중...', 400, 100); lctx.textAlign='left';

  const loadedPairs = await Promise.all(uniqueCovers.map(async url => [url, await loadImage(proxied(url))]));
  const imageMap = new Map(loadedPairs);

  const W = 800, padX = 50;
  const dowY = 210, gridTop = 260;
  const colW = (W - padX*2) / 7;
  const bookW = colW * 0.74, bookH = bookW * 1.42;
  const emptyRowH = 70, bookRowH = bookH + 30;

  // 행별 높이 계산 (책이 있는 주는 표지 높이만큼, 없으면 숫자만 들어갈 낮은 높이)
  const rows = [];
  for(let w=0; w<weeks; w++){
    const rowDays = days.slice(w*7, w*7+7);
    const hasBook = rowDays.some(d => (byDate[toLocalDateStr(d)]||[]).length>0);
    rows.push({ days: rowDays, height: hasBook ? bookRowH : emptyRowH });
  }
  const gridH = rows.reduce((s,r)=>s+r.height, 0);
  const H = gridTop + gridH + 36;

  const canvas = document.getElementById('shareCanvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,W,H);

  // 큰 날짜 타이틀 "YYYY.MM."
  ctx.fillStyle = '#18181b'; ctx.font = '800 52px Inter, sans-serif';
  ctx.fillText(`${year}.${String(month+1).padStart(2,'0')}.`, padX, 88);
  ctx.fillStyle = '#8a8a92'; ctx.font = '600 17px Inter, sans-serif';
  ctx.fillText(`이달 완독 ${monthBooks.length}권 · ${monthPages.toLocaleString()}페이지`, padX, 122);

  const dow = ['일','월','화','수','목','금','토'];
  ctx.font = '700 18px Inter, sans-serif'; ctx.fillStyle = '#a8a8b0'; ctx.textAlign = 'center';
  dow.forEach((d,i)=> ctx.fillText(d, padX + i*colW + colW/2, dowY));

  let y = gridTop;
  rows.forEach(row=>{
    row.days.forEach((day,col)=>{
      const centerX = padX + col*colW + colW/2;
      const dateStr = toLocalDateStr(day);
      const dayBooks = (byDate[dateStr]||[]).slice(0,2); // 최대 2권까지 표시
      const isOther = day.getMonth()!==month;

      if(dayBooks.length===0){
        // 책 없는 날: 숫자만 표시
        ctx.fillStyle = isOther ? '#e4e4e8' : '#c4c4cc';
        ctx.font = '700 23px Inter, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(String(day.getDate()), centerX, y + emptyRowH/2 + 8);
        return;
      }

      // 책 있는 날: 세로형 표지 이미지 (겹치지 않게 나란히)
      const n = dayBooks.length;
      const w = n===1 ? bookW : bookW*0.62;
      const h = w*1.42;
      const gap = 5;
      const groupW = w*n + gap*(n-1);
      let bx = centerX - groupW/2;
      const by = y + (row.height-30-h)/2 + 6;

      dayBooks.forEach(book=>{
        const img = book.cover ? imageMap.get(book.cover) : null;
        roundRect(ctx, bx, by, w, h, 8);
        ctx.save(); ctx.clip();
        if(img){
          const scale = Math.max(w/img.width, h/img.height);
          const iw=img.width*scale, ih=img.height*scale;
          ctx.drawImage(img, bx+(w-iw)/2, by+(h-ih)/2, iw, ih);
        }else{
          ctx.fillStyle = book.color; ctx.fillRect(bx,by,w,h);
        }
        ctx.restore();
        ctx.strokeStyle='rgba(0,0,0,0.06)'; ctx.lineWidth=1;
        roundRect(ctx, bx, by, w, h, 8); ctx.stroke();
        bx += w+gap;
      });

      // 날짜 숫자 - 표지 그룹 아래에 작게
      ctx.fillStyle = '#9a9aa4'; ctx.font='700 15px Inter, sans-serif'; ctx.textAlign='center';
      ctx.fillText(String(day.getDate()), centerX, by+h+21);
    });
    y += row.height;
  });
  ctx.textAlign = 'left';

  document.getElementById('shareModal').classList.remove('hidden');
  canvas.toBlob(blob=> currentShareBlob = blob, 'image/png');
}

function closeShareModal(){ document.getElementById('shareModal').classList.add('hidden'); currentShareBlob=null; unlockBodyScroll(); }

function downloadShareImage(){
  const canvas = document.getElementById('shareCanvas');
  const url = canvas.toDataURL('image/png');
  const a = document.createElement('a');
  a.href = url; a.download = `독서기록-${toLocalDateStr(new Date())}.png`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

async function shareImage(){
  if(!currentShareBlob){
    const canvas = document.getElementById('shareCanvas');
    currentShareBlob = await new Promise(r=> canvas.toBlob(r,'image/png'));
  }
  const file = new File([currentShareBlob], 'reading.png', {type:'image/png'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:'독서기록'}); }catch(e){ /* 취소됨 */ }
  }else{
    downloadShareImage();
  }
}

/* ---------------- Firebase 클라우드 동기화 ---------------- */
let fbApp=null, fbAuth=null, fbDb=null, currentUser=null, syncing=false;

function initFirebase(){
  let cfg = null;
  try{ cfg = JSON.parse(localStorage.getItem('firebase-config')||'null'); }catch(e){}
  if(!cfg) return;
  try{
    fbApp = firebase.initializeApp(cfg);
    fbAuth = firebase.auth();
    fbDb = firebase.firestore();
    fbAuth.getRedirectResult().catch(err=>{
      console.error('redirect result error', err);
      if(err && err.code) alert('로그인 처리 중 오류: ' + err.code);
    });
    fbAuth.onAuthStateChanged(user=>{
      currentUser = user;
      renderSyncArea();
      if(user) pullFromCloud();
    });
  }catch(e){
    console.error('Firebase 초기화 실패', e);
  }
}

function openFirebaseSetup(){
  document.getElementById('firebaseConfigInput').value='';
  document.getElementById('firebaseSetupModal').classList.remove('hidden');
  lockBodyScroll();
}
function closeFirebaseSetup(){ document.getElementById('firebaseSetupModal').classList.add('hidden'); unlockBodyScroll(); }

function saveFirebaseConfig(){
  const text = document.getElementById('firebaseConfigInput').value.trim();
  if(!text){ alert('firebaseConfig 코드를 붙여넣어주세요.'); return; }
  try{
    const match = text.match(/\{[\s\S]*\}/);
    if(!match) throw new Error('중괄호로 감싼 설정 객체를 찾을 수 없어요.');
    const cfg = new Function('return ' + match[0])();
    if(!cfg.apiKey || !cfg.projectId) throw new Error('apiKey 또는 projectId가 없어요.');
    localStorage.setItem('firebase-config', JSON.stringify(cfg));
    closeFirebaseSetup();
    initFirebase();
    renderSyncArea();
    alert('연결되었어요! 이제 Google로 로그인해보세요.');
  }catch(e){
    alert('설정값을 읽을 수 없어요. Firebase 콘솔에서 복사한 코드 그대로 붙여넣어주세요.\n\n('+e.message+')');
  }
}

function disconnectFirebase(){
  if(!confirm('클라우드 연결을 해제할까요? (기기에 저장된 데이터는 그대로 남아요)')) return;
  if(fbAuth) fbAuth.signOut();
  localStorage.removeItem('firebase-config');
  fbApp=null; fbAuth=null; fbDb=null; currentUser=null;
  renderSyncArea();
}

function signInGoogle(){
  if(!fbAuth){ alert('먼저 Firebase를 연결해주세요.'); return; }
  const provider = new firebase.auth.GoogleAuthProvider();
  fbAuth.signInWithRedirect(provider).catch(err=>{
    alert('로그인 중 오류가 발생했어요:\n' + err.code + '\n' + err.message);
    console.error(err);
  });
}
function signOutGoogle(){ if(fbAuth) fbAuth.signOut(); }

async function pushToCloud(){
  if(!currentUser || !fbDb || syncing) return;
  syncing = true;
  try{
    await fbDb.collection('users').doc(currentUser.uid).set({
      books,
      appTitle: localStorage.getItem('app-title') || null,
      appSubtitle: localStorage.getItem('app-subtitle') || null,
      updatedAt: Date.now()
    });
    localStorage.setItem('last-sync', new Date().toISOString());
  }catch(e){
    console.error('클라우드 저장 실패', e);
  }finally{
    syncing = false;
    renderSyncArea();
  }
}

async function pullFromCloud(){
  if(!currentUser || !fbDb) return;
  try{
    const snap = await fbDb.collection('users').doc(currentUser.uid).get();
    if(snap.exists){
      const data = snap.data();
      if(Array.isArray(data.books)){
        books = data.books.map(b => ({ status:'completed', tags:[], startDate:null, ...b, tags: b.tags||[] }));
        saveBooksRaw();
      }
      if(data.appTitle) localStorage.setItem('app-title', data.appTitle);
      if(data.appSubtitle) localStorage.setItem('app-subtitle', data.appSubtitle);
      applyTitleFromStorage();
      render();
    }else{
      // 클라우드에 데이터가 없으면 지금 기기의 데이터를 최초 업로드
      pushToCloud();
    }
    localStorage.setItem('last-sync', new Date().toISOString());
    renderSyncArea();
  }catch(e){
    console.error('클라우드 불러오기 실패', e);
  }
}

function renderSyncArea(){
  const el = document.getElementById('syncArea');
  if(!el) return;
  const hasConfig = !!localStorage.getItem('firebase-config');

  if(!hasConfig){
    el.innerHTML = `
      <div class="sync-card">
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px;line-height:1.6">기기가 바뀌어도 데이터를 이어보려면 Google 계정으로 동기화할 수 있어요.</div>
        <button class="btn-secondary" style="margin-top:0" onclick="openFirebaseSetup()">🔥 Firebase 연결하기</button>
      </div>`;
    return;
  }

  if(!currentUser){
    el.innerHTML = `
      <div class="sync-card">
        <button class="google-btn" onclick="signInGoogle()">Google로 로그인</button>
        <button class="btn-delete" style="width:100%;margin-top:8px" onclick="disconnectFirebase()">연결 해제</button>
      </div>`;
    return;
  }

  const lastSync = localStorage.getItem('last-sync');
  const lastSyncLabel = lastSync ? new Date(lastSync).toLocaleString('ko-KR') : '아직 없음';
  el.innerHTML = `
    <div class="sync-card">
      <div class="row">
        ${currentUser.photoURL ? `<img class="avatar" src="${currentUser.photoURL}"/>` : `<div class="avatar"></div>`}
        <div>
          <div class="name">${currentUser.displayName||'사용자'}</div>
          <div class="email">${currentUser.email||''}</div>
        </div>
      </div>
      <div class="status">${syncing ? '동기화 중...' : `✓ 동기화됨 · 마지막: ${lastSyncLabel}`}</div>
      <div class="settings-row">
        <button class="btn-secondary" style="margin-top:0" onclick="pullFromCloud()">⬇ 클라우드에서 불러오기</button>
        <button class="btn-delete" style="margin-top:0" onclick="signOutGoogle()">로그아웃</button>
      </div>
    </div>`;
}

/* ---------------- 초기화 ---------------- */
document.getElementById('dateInput').addEventListener('input', autoFillStartDate);
document.getElementById('dateInput').addEventListener('change', autoFillStartDate);
document.getElementById('startDateInput').addEventListener('input', ()=>{ startDateManuallyEdited = true; });
document.getElementById('startDateInput').addEventListener('change', ()=>{ startDateManuallyEdited = true; });

applyTitleFromStorage();
render();
initFirebase();
</script>
