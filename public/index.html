<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>독서기록</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif; }
  .modal-backdrop { background: rgba(0,0,0,0.4); }
</style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-50 min-h-screen pb-24">

<div class="max-w-2xl mx-auto p-6">
  <!-- Header -->
  <div class="mb-6">
    <h1 class="text-3xl font-bold text-gray-800 flex items-center gap-2">
      📚 독서기록
    </h1>
    <p class="text-gray-500 text-sm mt-1">책을 검색하면 페이지 수를 자동으로 가져와요</p>
  </div>

  <!-- View Toggle -->
  <div class="flex gap-2 mb-6">
    <button id="tabStack" onclick="switchView('stack')" class="flex-1 py-2.5 rounded-lg font-semibold text-sm bg-indigo-600 text-white transition-colors">
      📚 책 쌓기
    </button>
    <button id="tabCalendar" onclick="switchView('calendar')" class="flex-1 py-2.5 rounded-lg font-semibold text-sm bg-white text-gray-600 border border-gray-200 transition-colors">
      📅 캘린더
    </button>
  </div>

  <!-- Content -->
  <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
    <div id="stackView"></div>
    <div id="calendarView" class="hidden"></div>
  </div>
</div>

<!-- Floating Add Button -->
<button onclick="openAddModal()" class="fixed bottom-6 right-6 bg-indigo-600 hover:bg-indigo-700 text-white rounded-full p-4 shadow-lg transition-colors text-2xl w-14 h-14 flex items-center justify-center">
  +
</button>

<!-- Add Book Modal -->
<div id="addModal" class="hidden fixed inset-0 modal-backdrop flex items-end sm:items-center justify-center z-50 p-4">
  <div class="bg-white rounded-2xl sm:rounded-xl w-full max-w-md p-6 max-h-[85vh] overflow-y-auto">
    <div class="flex justify-between items-center mb-5">
      <h2 class="text-lg font-bold text-gray-800">책 추가하기</h2>
      <button onclick="closeAddModal()" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
    </div>

    <!-- Search -->
    <div class="mb-4">
      <label class="text-xs font-semibold text-gray-500 mb-1 block">책 제목 검색</label>
      <div class="flex gap-2">
        <input id="searchInput" type="text" placeholder="예: 토지"
          class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-indigo-500"
          onkeypress="if(event.key==='Enter') searchBooks()">
        <button onclick="searchBooks()" id="searchBtn"
          class="px-5 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold whitespace-nowrap">
          검색
        </button>
      </div>
    </div>

    <!-- Search Results -->
    <div id="searchResults" class="mb-4 space-y-2 max-h-64 overflow-y-auto"></div>

    <!-- Selected Book / Manual Entry Form -->
    <div id="entryForm" class="space-y-4 border-t border-gray-100 pt-4">
      <div>
        <label class="text-xs font-semibold text-gray-500 mb-1 block">책 제목</label>
        <input id="titleInput" type="text" placeholder="검색해서 선택하거나 직접 입력"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-indigo-500">
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-500 mb-1 block">페이지 수</label>
        <input id="pagesInput" type="number" placeholder="예: 472" min="1"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-indigo-500">
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-500 mb-1 block">완독 날짜</label>
        <input id="dateInput" type="date"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-indigo-500">
      </div>
      <button onclick="addBook()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-semibold">
        추가하기
      </button>
    </div>
  </div>
</div>

<script>
let books = JSON.parse(localStorage.getItem('reading-books') || '[]');
let currentMonth = new Date();
let currentView = 'stack';

// ---------- Storage ----------
function saveBooks() {
  localStorage.setItem('reading-books', JSON.stringify(books));
}

// ---------- View Switching ----------
function switchView(view) {
  currentView = view;
  document.getElementById('tabStack').className = view === 'stack'
    ? 'flex-1 py-2.5 rounded-lg font-semibold text-sm bg-indigo-600 text-white transition-colors'
    : 'flex-1 py-2.5 rounded-lg font-semibold text-sm bg-white text-gray-600 border border-gray-200 transition-colors';
  document.getElementById('tabCalendar').className = view === 'calendar'
    ? 'flex-1 py-2.5 rounded-lg font-semibold text-sm bg-indigo-600 text-white transition-colors'
    : 'flex-1 py-2.5 rounded-lg font-semibold text-sm bg-white text-gray-600 border border-gray-200 transition-colors';
  document.getElementById('stackView').classList.toggle('hidden', view !== 'stack');
  document.getElementById('calendarView').classList.toggle('hidden', view !== 'calendar');
  render();
}

// ---------- Modal ----------
function openAddModal() {
  document.getElementById('addModal').classList.remove('hidden');
  document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];
  document.getElementById('searchInput').focus();
}
function closeAddModal() {
  document.getElementById('addModal').classList.add('hidden');
  document.getElementById('searchInput').value = '';
  document.getElementById('titleInput').value = '';
  document.getElementById('pagesInput').value = '';
  document.getElementById('searchResults').innerHTML = '';
}

// ---------- Search (calls backend -> Aladin API) ----------
async function searchBooks() {
  const query = document.getElementById('searchInput').value.trim();
  if (!query) return;

  const btn = document.getElementById('searchBtn');
  const resultsDiv = document.getElementById('searchResults');
  btn.textContent = '검색 중...';
  btn.disabled = true;
  resultsDiv.innerHTML = '';

  try {
    const res = await fetch(`/api/search?query=${encodeURIComponent(query)}`);
    const data = await res.json();

    if (data.error) {
      resultsDiv.innerHTML = `<div class="text-red-500 text-sm p-3 bg-red-50 rounded-lg">${data.error}</div>`;
      return;
    }

    if (!data.books || data.books.length === 0) {
      resultsDiv.innerHTML = `<div class="text-gray-400 text-sm p-3">검색 결과가 없어요. 직접 입력해주세요.</div>`;
      return;
    }

    resultsDiv.innerHTML = data.books.map((book, i) => `
      <button onclick='selectBook(${i})' data-book='${JSON.stringify(book).replace(/'/g, "&apos;")}'
        class="w-full text-left p-3 rounded-lg border border-gray-200 hover:border-indigo-500 hover:bg-indigo-50 transition-colors flex gap-3 items-center book-result-btn">
        ${book.cover ? `<img src="${book.cover}" class="w-10 h-14 object-cover rounded flex-shrink-0" />` : ''}
        <div class="min-w-0">
          <div class="font-semibold text-gray-800 text-sm truncate">${book.title}</div>
          <div class="text-xs text-gray-500 truncate">${book.author || ''}</div>
        </div>
      </button>
    `).join('');

    window._searchResults = data.books;
  } catch (error) {
    resultsDiv.innerHTML = `<div class="text-red-500 text-sm p-3 bg-red-50 rounded-lg">검색 중 오류가 발생했습니다.</div>`;
  } finally {
    btn.textContent = '검색';
    btn.disabled = false;
  }
}

async function selectBook(index) {
  const book = window._searchResults[index];
  document.getElementById('titleInput').value = book.title;
  document.getElementById('pagesInput').value = '가져오는 중...';

  try {
    const res = await fetch(`/api/detail/${book.itemId}`);
    const data = await res.json();

    if (data.pages && data.pages > 0) {
      document.getElementById('pagesInput').value = data.pages;
    } else {
      document.getElementById('pagesInput').value = '';
      alert('페이지 수를 찾을 수 없어요. 직접 입력해주세요.');
    }
  } catch (error) {
    document.getElementById('pagesInput').value = '';
    alert('페이지 수 조회 실패. 직접 입력해주세요.');
  }
}

// ---------- Add Book ----------
function addBook() {
  const title = document.getElementById('titleInput').value.trim();
  const pages = parseInt(document.getElementById('pagesInput').value);
  const date = document.getElementById('dateInput').value || new Date().toISOString().split('T')[0];

  if (!title) { alert('책 제목을 입력해주세요!'); return; }
  if (!pages || pages <= 0) { alert('올바른 페이지 수를 입력해주세요!'); return; }

  books.push({
    id: Date.now(),
    title, pages, completedDate: date,
    color: `hsl(${Math.floor(Math.random()*360)}, 65%, 58%)`
  });
  saveBooks();
  closeAddModal();
  render();
}

function removeBook(id) {
  books = books.filter(b => b.id !== id);
  saveBooks();
  render();
}

// ---------- Render ----------
function render() {
  if (currentView === 'stack') renderStack();
  else renderCalendar();
}

function renderStack() {
  const totalPages = books.reduce((s, b) => s + b.pages, 0);
  const sorted = [...books].sort((a,b) => new Date(a.completedDate) - new Date(b.completedDate));
  const bookHeight = books.length > 0 ? Math.max(14, Math.min(420 / books.length, 48)) : 40;

  let html = `
    <div class="flex flex-col items-center gap-6">
      <div class="text-center">
        <div class="text-4xl font-bold text-gray-800">${totalPages.toLocaleString()}</div>
        <div class="text-gray-600 text-sm mt-1">총 읽은 페이지 · ${books.length}권</div>
      </div>
      <div class="w-full max-w-sm min-h-[100px] flex flex-col-reverse items-center">`;

  if (books.length === 0) {
    html += `<div class="text-gray-400 py-16 text-center">아직 기록된 책이 없어요.<br/>+ 버튼으로 추가해보세요!</div>`;
  } else {
    sorted.forEach(book => {
      html += `
        <div class="group relative w-full flex items-center justify-center rounded-md shadow-sm transition-transform hover:scale-[1.02]"
          style="height:${bookHeight}px; background-color:${book.color}; margin-bottom:3px;">
          <div class="text-white text-center px-3 leading-tight overflow-hidden">
            <span class="font-semibold text-xs">${book.title}</span>
            <span class="text-xs opacity-90 ml-2">${book.pages}p</span>
          </div>
          <button onclick="removeBook(${book.id})"
            class="absolute right-2 opacity-0 group-hover:opacity-100 transition-opacity bg-black/30 hover:bg-red-500 text-white p-1 rounded text-xs">
            🗑
          </button>
        </div>`;
    });
  }

  html += `</div>`;

  if (books.length > 0) {
    html += `<div class="w-full max-w-sm bg-gray-50 rounded-lg p-4">
      <div class="text-sm font-semibold text-gray-700 mb-3">읽은 책 목록</div>
      <div class="space-y-2 max-h-56 overflow-y-auto">`;
    [...sorted].reverse().forEach(book => {
      html += `<div class="flex justify-between items-center text-sm text-gray-600 pb-2 border-b border-gray-200">
        <div><div class="font-medium text-gray-800">${book.title}</div>
        <div class="text-xs text-gray-400">${book.completedDate}</div></div>
        <span class="font-semibold">${book.pages}p</span></div>`;
    });
    html += `</div></div>`;
  }

  html += `</div>`;
  document.getElementById('stackView').innerHTML = html;
}

function toLocalDateStr(d) {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function renderCalendar() {
  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month+1, 0);
  const startDate = new Date(firstDay);
  startDate.setDate(startDate.getDate() - firstDay.getDay());
  const endDate = new Date(lastDay);
  endDate.setDate(endDate.getDate() + (6 - lastDay.getDay()));

  const monthBooks = books.filter(b => {
    const d = new Date(b.completedDate);
    return d.getFullYear() === year && d.getMonth() === month;
  });
  const byDate = {};
  monthBooks.forEach(b => { (byDate[b.completedDate] = byDate[b.completedDate] || []).push(b); });

  const days = [];
  const cursor = new Date(startDate);
  while (cursor <= endDate) { days.push(new Date(cursor)); cursor.setDate(cursor.getDate()+1); }

  const dayNames = ['일','월','화','수','목','금','토'];

  let html = `
    <div class="w-full max-w-2xl mx-auto">
      <div class="flex justify-between items-center mb-6">
        <button onclick="changeMonth(-1)" class="px-3 py-2 text-gray-600 hover:bg-gray-100 rounded-lg font-bold">←</button>
        <div class="text-xl font-bold text-gray-800">${year}년 ${month+1}월</div>
        <button onclick="changeMonth(1)" class="px-3 py-2 text-gray-600 hover:bg-gray-100 rounded-lg font-bold">→</button>
      </div>
      <div class="grid grid-cols-7 gap-1 mb-2">
        ${dayNames.map(d => `<div class="text-center text-xs font-semibold text-gray-500 py-1">${d}</div>`).join('')}
      </div>
      <div class="grid grid-cols-7 gap-1 mb-6">`;

  days.forEach(day => {
    const dateStr = toLocalDateStr(day);
    const dayBooks = byDate[dateStr] || [];
    const isCurrentMonth = day.getMonth() === month;
    const main = dayBooks[0];
    if (main) {
      html += `<div class="aspect-square rounded-lg border flex flex-col items-center justify-center text-xs" style="background-color:${main.color};border-color:${main.color}" title="${dayBooks.map(b=>b.title).join(', ')}">
        <span class="text-white">📖</span>
        <span class="text-white text-[10px]">${day.getDate()}</span>
        ${dayBooks.length > 1 ? `<span class="text-white text-[9px]">+${dayBooks.length-1}</span>` : ''}
      </div>`;
    } else {
      html += `<div class="aspect-square rounded-lg border flex items-center justify-center text-xs ${isCurrentMonth?'border-gray-200':'border-gray-100 opacity-30'}">
        <span class="${isCurrentMonth?'text-gray-400':'text-gray-300'}">${day.getDate()}</span>
      </div>`;
    }
  });

  html += `</div><div class="bg-gray-50 rounded-lg p-4">
    <div class="text-sm font-semibold text-gray-700 mb-3">이달의 완독 · ${monthBooks.length}권</div>`;

  if (monthBooks.length === 0) {
    html += `<div class="text-gray-400 text-sm text-center py-4">이 달에 완독한 책이 없어요</div>`;
  } else {
    html += `<div class="space-y-2">`;
    [...monthBooks].sort((a,b) => new Date(a.completedDate)-new Date(b.completedDate)).forEach(book => {
      html += `<div class="flex items-center gap-3 pb-2 border-b border-gray-200 last:border-0">
        <div class="w-4 h-6 rounded flex-shrink-0" style="background-color:${book.color}"></div>
        <div class="flex-1 min-w-0">
          <div class="text-sm font-semibold text-gray-800 truncate">${book.title}</div>
          <div class="text-xs text-gray-500">${book.pages}p · ${book.completedDate}</div>
        </div></div>`;
    });
    html += `</div>`;
  }

  html += `</div></div>`;
  document.getElementById('calendarView').innerHTML = html;
}

function changeMonth(delta) {
  currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + delta, 1);
  renderCalendar();
}

// Init
render();
</script>
</body>
</html>
